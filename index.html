<html lang="en">

<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  /* Layout: one phone column on warm cream. 1-bit pixel "game windows" sit in black rounded cards; everything else is soft pastel UI with black pills and a floating black tab bar. Single light theme by choice. */
  --bg:#f6f1e6;
  --card:#fffbf3;
  --ink:#171614;
  --muted:#6b665b;
  --line:#e9e1d1;
  --track:#ece4d3;
  --yellow:#f2d982; --sage:#a9b97c; --pink:#eeb7d8; --blue:#b8c9ef; --peach:#f4bf92;
  --accent:#d6eab0; --gold:#f2d982; --hp:#ffa8cf; --hpc:#e98a9a; --inv:#ffffff;
  --pastel-ink:#171614;
  --sans:"Outfit", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --pixel:"Silkscreen", ui-monospace, "Courier New", monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding:18px 18px 120px;display:flex;flex-direction:column;gap:18px}
h1,h2{margin:0;text-wrap:balance}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:2px}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.5px}
.goldpill{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:9px 14px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;flex:none}
.goldpill i{width:10px;height:10px;border-radius:50%;background:var(--yellow);display:block}
.muted{color:var(--muted)}
.small{font-size:13px}
.how{font-size:13.5px;color:var(--muted);margin:0;line-height:1.45}

/* 1-bit game windows */
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;width:100%}
.game{background:#141312;border-radius:28px;padding:10px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(23,22,20,.18)}
.game canvas{border-radius:18px;aspect-ratio:64/44}
.game.boss canvas{aspect-ratio:1}
.dlg{border:2px solid #f1eee4;padding:2px;border-radius:4px}
.dlg-in{border:1px solid #f1eee4;padding:9px 11px;color:#f1eee4;font-family:var(--pixel);font-size:11px;line-height:1.5;display:flex;flex-direction:column;gap:6px}
.dlg-h{display:flex;justify-content:space-between;gap:10px;text-transform:uppercase;font-size:12px}
.dlg-name{color:#fff;font-weight:700}
.dlg p{color:#9b968c}
.dlg-won{color:#eeb7d8;font-weight:700}
.dlg p{margin:0}
.dlg-bars{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 8px;align-items:center;font-size:10px}
.bitbar{height:8px;border:1px solid #f1eee4;padding:1px;display:block}
.bitbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,#f1eee4 0 3px,transparent 3px 4px)}

/* score ring */
.ring{position:relative;width:min(300px,82vw);margin:0 auto;aspect-ratio:1}
.ring svg{width:100%;height:100%;display:block;overflow:visible}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ring .center b{font-size:76px;font-weight:700;line-height:.9;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.ring .center span{color:var(--muted);font-size:14px;font-weight:500;margin-top:8px}
.actions{display:flex;gap:10px;align-items:center;justify-content:center}
.seg{display:inline-flex;background:var(--ink);border-radius:999px;padding:4px}
.seg button{background:none;border:0;color:#bdb6a8;padding:9px 16px;min-height:44px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink)}
.iconbtn{width:48px;height:48px;border-radius:50%;border:0;background:#ece5d6;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}

/* assistant card */
.assist{display:grid;grid-template-columns:1fr 92px;gap:12px;align-items:center;background:var(--pink);border:0;border-radius:26px;padding:16px 16px 16px 18px;text-align:left;cursor:pointer;width:100%}
.assist .k{font-size:12.5px;font-weight:600;opacity:.75}
.assist p{margin:4px 0 12px;font-size:17px;font-weight:600;line-height:1.3}
.assist .pillbtn{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.assist canvas{border-radius:16px;background:#141312;padding:4px;aspect-ratio:1}

/* sections + tasks */
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.sec-h h2{font-size:22px;font-weight:700;letter-spacing:-.3px}
.count{background:var(--ink);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:46px 1fr 44px;gap:12px;align-items:center;background:var(--card);border-radius:22px;padding:12px 12px 12px 12px;box-shadow:0 1px 0 var(--line)}
.ticon{width:46px;height:46px;min-width:46px;flex:none;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ticon svg{flex:none}
.temoji{font-size:24px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.iconpick .temoji{font-size:20px}
.emojirow{display:flex;gap:8px;align-items:center}
.emojirow input{flex:1;font-size:20px}
.statlv{flex:none}
.tbody{display:flex;flex-direction:column;gap:5px;min-width:0}
.tkick{font-size:12px;font-weight:600;color:var(--muted)}
.tname{font-size:16.5px;font-weight:600;line-height:1.25}
.trow.done .tname{color:var(--muted)}
.tmeta{display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;font-size:13px;color:var(--muted)}
.chip-s{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:var(--ink)}
.chip-weak{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ink);color:#fff}
.wk{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.wkn{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wkn b{font-size:18px;color:var(--ink);font-weight:700}
.pbar{display:block;height:9px;border-radius:999px;background:var(--track);overflow:hidden;flex:1}
.pbar i{display:block;height:100%;border-radius:999px;background:var(--ink)}
.pbar.thick{height:14px}
.check{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}
.check:active{transform:scale(.92)}
.trow.done .check{background:var(--ink);color:#fff}
.check[disabled]{opacity:.3;cursor:default}
.trow.rested{opacity:.7}
.trow.rested .check{border-style:dashed}
.cl{grid-column:1/-1;margin:2px -12px -12px;border-top:1px solid var(--line);border-radius:0 0 22px 22px;overflow:hidden}
.clhead{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 22px 8px 12px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.clhead .pbar{flex:0 0 46px;height:7px}
.clchev{display:inline-flex;color:var(--muted);margin-left:auto}
.cllist{display:flex;flex-direction:column;padding:4px 12px 0}
.clitem{display:grid;grid-template-columns:1fr 44px;gap:12px;align-items:center;min-height:52px;padding-left:58px}
.cltext{font-size:15px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.clitem.on .cltext{color:var(--muted);text-decoration:line-through}
.clcheck{width:30px;height:30px;margin:0 7px;border-radius:8px;border:2px solid var(--ink);background:transparent;color:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;justify-self:center}
.clitem.on .clcheck{background:var(--pink);border-color:var(--pink);color:#171614}
.clcheck[disabled]{opacity:.3;cursor:default}
.rrmore{display:inline-flex;align-items:center;gap:4px;min-height:44px;border:0;background:transparent;color:var(--muted);font-size:12.5px;cursor:pointer;padding:0 4px}
.rrmore .clchev{margin-left:0}
.rrlist{flex-basis:100%;line-height:1.4}
.rr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.rrbtn{display:inline-flex;align-items:center;gap:5px;border:0;background:#efe7d6;border-radius:999px;padding:5px 12px;min-height:44px;font-size:12.5px;font-weight:600;cursor:pointer}
.rrbtn[disabled]{opacity:.45;cursor:default}

/* generic cards, buttons */
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 1px 0 var(--line)}
.btn{background:#ece5d6;border:0;border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer;line-height:1.2}
.btn.primary{background:var(--ink);color:#fff}
.btn.gold{background:var(--yellow)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
.btn.danger{background:transparent;color:#b5413c;box-shadow:inset 0 0 0 2px #e3a9a6}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px 14px;font-size:15px}
.kv b{font-weight:500;color:var(--muted)}
.kv span{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.loadout{grid-template-columns:auto 1fr}
.loadout span{text-align:left}
.bignum{display:flex;align-items:baseline;gap:8px}
.bignum b{font-size:56px;font-weight:700;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.bignum span{color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:12px 14px;font-size:15px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#ece5d6}
.pill.won{background:var(--sage)} .pill.lost{background:#f1c9c6} .pill.now{background:var(--yellow)} .pill.next{background:#ece5d6}
.skill{background:var(--card);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 var(--line)}
.skill.locked{opacity:.5}
.skill.ready{box-shadow:inset 0 0 0 2px var(--ink)}
.sname{font-size:17px;font-weight:700}
.kind{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.kind.relief{background:var(--sage)} .kind.dmg{background:var(--pink)} .kind.buff{background:var(--blue)}
.lvpips{display:inline-flex;gap:5px}
.lvpips i{width:10px;height:10px;border-radius:50%;background:var(--track)}
.lvpips i.on{background:var(--ink)}
.lbl{font-size:12px;font-weight:700;color:var(--muted);width:30px;flex:none}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:var(--card);border-radius:22px;padding:8px 8px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 0 var(--line)}
.item canvas{border-radius:15px;background:#141312}
.item canvas.icon{width:64%;margin:6px auto;aspect-ratio:1}
.item canvas.wide{aspect-ratio:64/44}
.item{align-items:stretch}
.item b{font-size:15px;font-weight:600;padding:0 4px}
.item .small{padding:0 4px}
.item .btn{margin-top:auto}
.item.eq{box-shadow:inset 0 0 0 2px var(--ink)}
.erow{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:22px;padding:12px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;color:var(--ink);font-family:var(--sans);font-size:16px;padding:11px 12px}
textarea{min-height:90px;font-size:13px}
.filebtn{position:relative;cursor:pointer;display:inline-flex;align-items:center}.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 12px;min-height:44px;min-width:44px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{border-color:transparent}
.opt{display:flex;flex-direction:column;gap:8px;padding:10px;background:#f4eee2;border-radius:16px}
.opt .row input{flex:1}
.checkrow{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;cursor:pointer}
.checkrow{min-height:44px}
.checkrow input{width:24px;height:24px;accent-color:var(--ink);flex:none}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:#cfc6b4;flex:none}
.sync.ok i{background:#7fa35a}

/* shop filters, stats panel */
.filters{display:flex;flex-direction:column;gap:10px}
.catpills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.catpills::-webkit-scrollbar{display:none}
.catpill{flex:none;border:0;background:#ece5d6;border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer}
.catpill.on{background:var(--ink);color:#fff}
.catpill{display:inline-flex;align-items:center;gap:4px}
.fbar{padding-bottom:2px}
.fsel{position:relative;padding-right:12px;gap:6px}
.fsel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:inherit;font:inherit;font-weight:600;font-size:14px;padding:0;margin:0;width:auto;min-width:0;cursor:pointer;outline:none}
.fsel select option{color:#171614}
.fsel svg{flex:none;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.seg.wide{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
.seg.wide button{padding:9px 6px}
.sheet .panel > *{flex-shrink:0}
.statcard{background:var(--card);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 var(--line)}
.statcard.editing{box-shadow:inset 0 0 0 2px var(--ink)}
.statlv{display:flex;flex-direction:column;align-items:center;margin-left:auto}
.statlv b{font-size:30px;font-weight:700;line-height:1;white-space:nowrap}
.statlv .plus{font-style:normal;font-size:18px;font-weight:700;color:#4f7a22;margin-left:3px}
html[data-mode="dark"] .statlv .plus{color:#b9d98a}
.statlv span{font-size:11px;color:var(--muted);font-weight:600}
.statsum{display:flex;flex-direction:column;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer}
.swatch.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.iconpick{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconpick.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sec-h > div h2{line-height:1.1}
#view{width:100%;min-width:0;max-width:100%}
.filters{min-width:0}
.tbody,.tname,.tkick,.rr,.rr span,.tmeta,.item b,.item .small,.tl span,.erow,.statcard .tbody{overflow-wrap:anywhere;min-width:0}

/* dark mode (Settings → General) */
html[data-mode="dark"]{--bg:#141312;--card:#1f1d1a;--ink:#f1ede4;--muted:#a59f92;--line:#2d2a26;--track:#34312c;--inv:#171614;--hpc:#e98a9a;color-scheme:dark}
html[data-mode="dark"] .navin{background:#141312;box-shadow:0 0 0 1px #2d2a26,0 12px 30px rgba(0,0,0,.5)}
html[data-mode="dark"] .navin button[aria-current="page"]{color:#fff}
html[data-mode="dark"] .navin .fab{box-shadow:0 0 0 6px var(--bg);color:var(--bg)}
html[data-mode="dark"] .goldpill,html[data-mode="dark"] .seg,html[data-mode="dark"] .count,html[data-mode="dark"] .btn.primary,html[data-mode="dark"] .chip-weak,html[data-mode="dark"] .float,html[data-mode="dark"] .toast,html[data-mode="dark"] .assist .pillbtn,html[data-mode="dark"] .catpill.on,html[data-mode="dark"] .iconpick.on{color:var(--inv)}
html[data-mode="dark"] .seg button{color:#77716a}
html[data-mode="dark"] .seg button.on{background:var(--bg);color:var(--ink)}
html[data-mode="dark"] .trow.done .check{color:var(--inv)}
html[data-mode="dark"] .btn,html[data-mode="dark"] .rrbtn,html[data-mode="dark"] .catpill,html[data-mode="dark"] .iconbtn{background:#2d2a26;color:var(--ink)}
html[data-mode="dark"] .btn.primary{background:var(--ink)}
html[data-mode="dark"] .btn.gold{background:var(--yellow);color:#171614}
html[data-mode="dark"] .btn.ghost{background:transparent}
html[data-mode="dark"] .btn.danger{background:transparent;color:#f0a19c}
html[data-mode="dark"] input[type=text],html[data-mode="dark"] input[type=password],html[data-mode="dark"] input[type=number],html[data-mode="dark"] select,html[data-mode="dark"] textarea,html[data-mode="dark"] .chip,html[data-mode="dark"] .iconpick{background:#171614;color:var(--ink);border-color:#3a3631}
html[data-mode="dark"] .iconpick.on{background:var(--ink);color:var(--inv);border-color:var(--ink)}
html[data-mode="dark"] .fsel select{background:transparent;border:0;color:inherit}
.fsel select option{background:#fff}
html[data-mode="dark"] .opt{background:#1a1816}
html[data-mode="dark"] .chip-s,html[data-mode="dark"] .ticon,html[data-mode="dark"] .kind,html[data-mode="dark"] .pill,html[data-mode="dark"] .assist,html[data-mode="dark"] .mystery{color:#171614}
html[data-mode="dark"] .pill.next{background:#34312c;color:var(--ink)}
html[data-mode="dark"] .catpill.on{background:var(--ink);color:var(--inv)}
html[data-mode="dark"] .chip-s.plain{color:var(--ink)}
html[data-mode="dark"] .trow.done .check{color:var(--inv)}
/* vitals, statuses, to-dos, potions */
.vitals{display:flex;flex-direction:column;gap:10px}
.vrow{display:grid;grid-template-columns:28px 1fr 74px;gap:12px;align-items:center}
.vlbl{font-size:12px;font-weight:700;color:var(--muted)}
.vnum{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pbar.vbar{height:12px}
.vnum b{color:var(--ink);font-size:15px}
.mppill{background:var(--blue);color:#171614;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.vrow .mppill{grid-column:auto}
.chip-status{background:#f1c9c6;color:#171614;border-radius:999px;padding:3px 10px;font-weight:700;font-size:12px}
.chip-rune{background:var(--blue);color:#171614;border-radius:999px;padding:3px 10px;font-weight:600;font-size:12px}
.chip-streak{background:var(--yellow);color:#171614;border-radius:999px;padding:3px 10px;font-weight:700;font-size:12px}
.chips.small{gap:6px}
.mystery{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--yellow);color:#171614;border-radius:18px;padding:10px 14px;font-size:14px}

.slcard{margin-top:22px;--card:rgba(241,238,228,.07);--ink:#f1eee4;--line:rgba(241,238,228,.1);--track:rgba(241,238,228,.12)}

.fpill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:11px 18px;min-height:46px;background:rgba(255,255,255,.12);color:#f1eee4;font:inherit;font-size:16px;font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}

.ptitle{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:36px;line-height:1.05;margin:2px 0 0;text-align:center;letter-spacing:-.01em}
.psub{font-size:17px;color:#bdb6c8;font-variant-numeric:tabular-nums}
/* the ring shrinks on shorter screens so the whole timer, its controls and the settings button fit on one screen */

.ringwrap.haschest{width:clamp(120px, calc(100vh - 580px), min(76vw, 300px));width:clamp(120px, calc(100dvh - 580px), min(76vw, 300px))}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.rtrack{fill:none;stroke:#5a5566;stroke-width:14}
.rbar{fill:none;stroke:#a18aff;stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.rbar.st-focus{stroke:#9fb6ff}

.rbar.st-long{stroke:#ffc27a}

#spaceCv{position:absolute;left:17%;top:17%;width:66%;height:66%;border-radius:50%;image-rendering:pixelated;background:#141312}
.ptime{font-size:66px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;margin-top:2px}
.pctrl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;width:100%;margin-top:4px}

.ptext[disabled]{opacity:.3;cursor:default}
.pmain{border:0;border-radius:999px;background:#f7f3ee;color:#141312;width:112px;height:62px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pstats{display:flex;gap:18px;margin-top:2px;font-size:14px;color:#9d96a8}
.psetbtn{display:inline-flex;align-items:center;gap:8px;margin-top:2px;background:rgba(241,238,228,.08);border:1.5px solid rgba(241,238,228,.18);color:#f1eee4;border-radius:999px;padding:8px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:12px}

.pstats b{color:#f1eee4;font-weight:700}
.pbelow{display:flex;flex-direction:column;gap:12px;color:#f1eee4;margin-top:20px}
.pbelow h3{font-size:20px;margin:8px 0 0}
.phow{font-size:14px;color:#9d96a8;margin:0;line-height:1.45}

.psteps{display:flex;flex-direction:column;background:rgba(255,255,255,.06);border-radius:22px;padding:4px 16px}

.pbtn-sq{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#f1eee4;font-size:22px;font-weight:600;cursor:pointer}

.leggrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.legslot{background:rgba(255,255,255,.06);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;text-align:center;min-width:0;overflow-wrap:anywhere;color:#d9d3e2}

.legslot canvas.wide{height:auto}

.legslot.have{box-shadow:inset 0 0 0 2px #e8c14a}

details.howto{background:var(--card);border-radius:18px;padding:0 14px;box-shadow:0 1px 0 var(--line)}

details.howto[open] summary::after{transform:rotate(-135deg)}
details.howto .how{padding-bottom:12px;margin:0}
.howlist{margin:0 0 12px;padding-left:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.inn{flex-wrap:nowrap}

.item.owned canvas{filter:grayscale(1);opacity:.45}
.item.owned > b, .item.owned > .small{opacity:.55}
.item.locked canvas{filter:brightness(.42)}
.addlist{display:flex;flex-direction:column;gap:10px}
.addlist .how{margin:0}
.plainadd{margin:4px 0 12px}
.tditem.plain.done{grid-template-columns:24px 1fr auto 44px}
.slot.locked2h{opacity:.5}
.slot.locked2h canvas{filter:brightness(.6)}
.invbtns{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:none}
.invbtns .btn{white-space:nowrap}
.item .tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.tagtier{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--track);color:var(--ink);border-radius:999px;padding:2px 7px}
.ownedtag{align-self:center;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sellbtn{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.sellbtn.armed{background:var(--pink);box-shadow:none;color:#171614}

.mystery .ntext{flex:1}
.nclose{border:0;background:rgba(0,0,0,.08);color:#171614;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;margin:-4px -6px -4px 0}
.vitals{position:relative}
.cardtog{position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.cardtog svg{transform:rotate(90deg)}
.vitals .vrow{padding-right:30px}
.assistwrap{position:relative}
.assistwrap .cardtog{background:rgba(0,0,0,.08);color:#171614;top:10px;right:10px}
.mini{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:20px;padding:6px 6px 6px 14px;box-shadow:0 1px 0 var(--line)}
.minimain{flex:1;display:flex;align-items:center;gap:12px;border:0;background:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer;min-height:44px;min-width:0;padding:0}
.minitog{width:36px;height:36px;border:0;border-radius:50%;background:var(--track);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}

.vmini .vm{flex:1;display:flex;align-items:center;gap:6px;min-width:0}

.vmini .vm .pbar{flex:1;height:8px}
.assistmini{background:var(--pink);color:#171614}
.assistmini .minimain{color:#171614}
.assistmini canvas{width:46px;height:auto;border-radius:10px;background:#141312;padding:3px;image-rendering:pixelated;aspect-ratio:1}
.assistmini .minimain > span{display:flex;flex-direction:column;min-width:0}
.assistmini .minitog{background:rgba(0,0,0,.08);color:#171614}

.ptog{border:0;border-radius:999px;min-width:64px;min-height:36px;padding:0 14px;font:inherit;font-weight:700;background:rgba(255,255,255,.12);color:#bdb6c8;cursor:pointer}
.ptog.on{background:#f1eee4;color:#141312}
.fmusic{cursor:pointer;gap:6px}
.fmusic.on{background:rgba(241,238,228,.92);color:#141312}
.lofimenu{position:fixed;top:calc(env(safe-area-inset-top) + 76px);right:18px;z-index:30;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:22px;background:rgba(28,30,52,.96);box-shadow:0 12px 32px rgba(0,0,0,.4);width:260px}
.lofiopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;border-radius:16px;padding:10px 14px;background:transparent;color:#f1eee4;font:inherit;text-align:left;cursor:pointer}
.lofiopt b{font-size:15px}.lofiopt span{font-size:12px;color:#bdb6c8}
.lofiopt.on{background:rgba(241,238,228,.92);color:#141312}.lofiopt.on span{color:#4a4640}

.sneed{display:block;font-size:12px;color:#b4555f;margin-top:3px}
.sneed.ok{color:var(--muted)}
.sneed i{font-style:normal;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.05em;background:var(--track);color:var(--ink);border-radius:999px;padding:1px 6px;margin-right:2px}
.fab.badge{position:relative}
.fab.badge::after{content:'';position:absolute;top:7px;right:7px;width:12px;height:12px;min-width:12px;min-height:12px;flex:none;aspect-ratio:1;border-radius:50%;background:#2f5fd0;box-shadow:none;pointer-events:none}
html[data-mode="dark"] .sneed{color:#f0a3ab}

.tree{display:flex;flex-direction:column;gap:14px}
.branch{background:var(--card);border-radius:22px;padding:12px 14px 4px;box-shadow:0 1px 0 var(--line)}
.branch.lean{box-shadow:inset 0 0 0 2px var(--ink)}
.bhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;width:100%;background:none;border:0;padding:2px 0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.bhead .clchev{margin-left:auto;display:inline-flex}
.bhead .leantag + .clchev{margin-left:6px}
.branch.shut{padding-bottom:10px}
.branch.shut .bhead{margin-bottom:0}
.eqtag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--ink);color:var(--inv);border-radius:999px;padding:1px 7px;vertical-align:middle}
.skgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sktile{background:var(--card);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 0 var(--line);min-width:0}
.sktile.ready{box-shadow:inset 0 0 0 2px var(--ink)}
.sktile.empty{box-shadow:inset 0 0 0 2px var(--line);background:transparent;justify-content:center;align-items:flex-start;min-height:104px;border:0;outline:2px dashed var(--line);outline-offset:-2px}
.sktile .btn{width:100%;padding-left:6px;padding-right:6px;font-size:13px;text-align:center;justify-content:center}
.skfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;width:100%}
.sktile.empty{justify-content:flex-start}
.ptsdot{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:999px;background:var(--pink);color:#171614;font-size:12px;font-weight:700;margin-right:8px;padding:0 6px}
.sktile select{font-size:13px;padding:6px 8px;min-width:0;width:100%}
.skhead{display:flex;align-items:center;gap:6px;min-width:0}
.skhead .sname{font-size:15px;line-height:1.15;flex:1;min-width:0}
.kdot{width:10px;height:10px;border-radius:50%;flex:none}
.kdot.dmg{background:var(--pink)} .kdot.relief{background:var(--sage)} .kdot.buff{background:var(--blue)}
.skoff{flex:none;width:24px;height:24px;border-radius:50%;border:0;background:var(--track);color:var(--ink);font-size:11px;line-height:24px;padding:0;cursor:pointer}
.skmeta{display:flex;align-items:center;justify-content:space-between;gap:6px}
.skmeta .lvpips{gap:3px}
.skmeta .lvpips i{width:7px;height:7px}
.skmore{background:var(--card);border-radius:22px;box-shadow:0 1px 0 var(--line);margin-top:12px}
.skmorehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;background:none;border:0;padding:14px 16px;color:inherit;font:inherit;text-align:left;cursor:pointer}
.skmorehead .clchev{margin-left:auto;display:inline-flex}
.skmore .sprows{padding-top:0}
.linkbtn{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}
.bhead b{font-size:16px}
.bdot{width:14px;height:14px;border-radius:50%;background:var(--bc);flex:none;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12)}
.leantag{margin-left:auto;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--ink);color:var(--inv);border-radius:999px;padding:2px 8px}
.bnodes{position:relative;padding-left:20px}
.bnodes::before{content:'';position:absolute;left:6px;top:8px;bottom:18px;width:2px;background:var(--bc);border-radius:2px;z-index:0}
.sprow.node{position:relative}
.sprow.node::before{content:'';position:absolute;left:-19px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--bc);z-index:1}
.sprow.node.learned::before{background:var(--bc)}
.leancard{display:flex;align-items:center;gap:12px}
/* skill tree page: roomier cards and rows */
.skillpage{display:flex;flex-direction:column;gap:18px}
.skillpage .sec-h{margin:0}
.skillpage > .how{margin:0;padding:0 4px}
.skillpage .tree{gap:18px}
.skillpage .branch{padding:20px 20px 8px;border-radius:26px}
.skillpage .branch.shut{padding-bottom:20px}
.skillpage .bhead{gap:10px;margin-bottom:10px;flex-wrap:nowrap;align-items:baseline}
.skillpage .bhead .small{flex:1;min-width:0;line-height:1.35}
.skillpage .bhead .bdot, .skillpage .bhead .clchev{align-self:center}
.skillpage .bhead b{font-size:18px}
.skillpage .bnodes{padding-left:26px}
.skillpage .bnodes::before{left:7px}
.skillpage .sprow{gap:16px;padding:18px 0;align-items:center}
.skillpage .sprow.node::before{left:-25px;top:24px}
.skillpage .sprow .tname{font-size:16px;line-height:1.3}
.skillpage .sprow .tmeta{margin-top:6px;line-height:1.45}
.skillpage .sprow .lvpips{margin-right:8px}
.skillpage .sprow .kind{margin-left:6px}
.skillpage .sprow .btn{flex:none;min-width:96px;justify-content:center}
.skillpage .leancard{padding:16px 18px}

.pill.rite{background:#171614;color:#f1eee4}
html[data-mode="dark"] .pill.rite{background:#f1eee4;color:#171614}

.leanline{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.leanline b{color:var(--ink)}

/* ---- compact lists (Tiimo-sized rows) ---- */
.list,.tdlist{gap:7px}
.tdgroup{gap:8px}
.trow{grid-template-columns:34px 1fr 30px;gap:10px;padding:8px 10px;border-radius:18px}
.ticon{width:34px;height:34px;min-width:34px}
.ticon svg{width:17px;height:17px}
.tname{font-size:14.5px;line-height:1.2}
.tkick{font-size:11px}
.tmeta{font-size:11.5px;gap:3px 5px}
.chip-s{font-size:9.5px;padding:1px 6px}
.check{width:30px;height:30px;border-width:1.75px}
.check svg{width:15px;height:15px}
.wk{gap:8px}
.tditem{grid-template-columns:20px 1fr auto 30px;gap:9px;padding:8px 10px 8px 8px;border-radius:18px}
.tditem.done{grid-template-columns:20px 1fr 30px}
.tditem.done .check{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.tditem.plain.done .tdgrip i{visibility:hidden}
.tditem.plain.done{grid-template-columns:20px 1fr auto 30px}
.tdgrip{width:20px;height:30px;grid-template-columns:repeat(2,4px);gap:3px}
.tdgrip i{width:4px;height:4px}
.xbtn{width:26px;height:30px}
.xbtn svg{width:14px;height:14px}
.tdpill{padding:6px 12px;min-height:32px;font-size:11.5px;gap:8px}
.tdplus{width:30px;height:30px}
.tdplus svg{width:14px;height:14px}
.clhead{min-height:34px;padding:4px 18px 4px 10px;font-size:12px}
.cl .clitem{font-size:13.5px}
/* timers: a task card with a live day/hour/minute/second clock instead of a check */
.trow.tmrow{grid-template-columns:34px 1fr 26px;row-gap:6px}
.tmbadge{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;justify-self:center}
.tmdone .tmbadge{background:var(--pink);color:#171614}
.tmclock{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-left:44px}
.tmcell{display:flex;flex-direction:column;line-height:1.05}
.tmcell b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tmcell i{font-style:normal;font-size:10.5px;color:var(--muted);margin-top:2px}
.tmwk{grid-column:1/-1;padding-left:44px;margin-top:2px}
.tmdone:not(:has(.tmask)){opacity:.75}
.tmask{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-left:44px;padding-top:8px;border-top:1px solid var(--line);font-size:13.5px;font-weight:600}
.mystery.tmnote{background:var(--pink)}
.mystery.tmnote .ntext{flex:1 1 calc(100% - 34px)}
.pkcustom{display:flex;gap:6px;padding:4px 4px 6px}
.qminfo{color:var(--ink);font-weight:600}
.qminfo + *:not(:empty), .qminfo:not(:last-child){margin-bottom:6px}
.pkswatch{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:2px 6px 8px}
.pkswatch button{aspect-ratio:1;border:0;border-radius:50%;cursor:pointer}
.pkswatch button.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.pkcard.cal{width:min(300px,calc(100vw - 24px))}
.pkcal{padding:2px 6px 6px}
.pkcalh{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 8px}
.pkcalh b{font-size:15px}
.pkcalh span{display:flex;gap:4px}
.pkcalh button{width:32px;height:32px;border:0;border-radius:50%;background:var(--track);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pkcalg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.pkcalg i{font-style:normal;font-size:10.5px;font-weight:700;color:var(--muted);padding:2px 0 4px}
.pkcalg button{aspect-ratio:1;border:0;border-radius:50%;background:none;color:var(--ink);font:inherit;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.pkcalg button:hover{background:var(--track)}
.pkcalg button.today{font-weight:800;box-shadow:inset 0 0 0 1.5px var(--line)}
.pkcalg button.on{background:var(--ink);color:var(--inv);font-weight:700}
.pkcalg button:disabled{opacity:.3;cursor:default;background:none}
.pktime{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:15px}
html .pktime input{border:0;background:var(--track);border-radius:999px;padding:7px 12px;font:inherit;font-size:14.5px;color:var(--ink);width:auto}
html .pkcustom input{flex:1;min-width:0;border:0;background:var(--track);border-radius:12px;font:inherit;font-size:15px;color:var(--ink);padding:8px 12px}
/* checklist inside a task card: stays within the card, steps line up under the name, boxes centre under the check circle */

<script>
/* ---------- constants ---------- */
const LS_KEY = 'tidekeeper-save-v1';   // the app was called Tidekeeper first; this key never changes so existing saves keep loading
const ANCHOR = '2026-11-16';           // Monday: boss cycle 0 begins
const CYCLE = 14;                       // days per boss
const PAGES = /*PAGES*/true;
const BUILD = 'd4dea2b723';            // the Pages build stamps its version here, so an open app can tell when a newer one is out      // the GitHub Pages build: saves sync through your own GitHub gist
const PREVIEW = /*PREVIEW*/false;   // the preview build flips this on: test gold only exists there
const STATS = {
  MGT:{name:'Might',   c:'#f2d982', blurb:'Lifting and strength work'},
  STA:{name:'Stamina', c:'#b8c9ef', blurb:'Cardio and conditioning'},
  MOB:{name:'Mobility',c:'#eeb7d8', blurb:'Stretching and range of motion'},
  ARM:{name:'Defense', c:'#a9b97c', blurb:'Prehab: knees, glutes, wrists'},
  HRT:{name:'Focus',   c:'#f4bf92', blurb:'Home, laundry and food prep'}
};
const SK = Object.keys(STATS);
const STATS_BASE = JSON.parse(JSON.stringify(STATS));
const ABBR = {MGT:'MGT', STA:'STA', MOB:'MOB', ARM:'DEF', HRT:'FOC'};   // internal keys stay; ARM shows as Defense, HRT as Focus
SK.forEach(k => { STATS[k].abbr = ABBR[k]; STATS[k].icon = k; STATS_BASE[k].abbr = ABBR[k]; STATS_BASE[k].icon = k; });
const LOFI_KEYS = ['chill', 'upbeat', 'dreamy', 'afro', 'bloom', 'pulse', 'chip', 'glade', 'palmwine'];   // every Focus song (the ones after Lock-in come from Riff)
const STAT_ICONS = ['MGT','STA','MOB','ARM','HRT','wave','flame','leaf','star','book','moon','bolt'];

const TASK_ICONS = [...STAT_ICONS, 'sword', 'timer', 'bed', 'list', 'gift', 'sun', 'broom'];
function cleanEmoji(v){
  if (typeof v !== 'string') return '';

  try { if (typeof Intl !== 'undefined' && Intl.Segmenter) first = [...new Intl.Segmenter(undefined, {granularity:'grapheme'}).segment(v)][0].segment; } catch(e){}
  first = first.slice(0, 16);
  return /\p{Extended_Pictographic}|\p{Regional_Indicator}/u.test(first) ? first : '';
}
const taskIconOk = v => typeof v === 'string' && (TASK_ICONS.includes(v) || (v.startsWith('e:') && v.length > 2 && cleanEmoji(v.slice(2)) === v.slice(2)));
const STAT_COLORS = ['#f2d982','#b8c9ef','#eeb7d8','#a9b97c','#f4bf92','#c9b8f0','#9fd8cf','#e9a3a3'];
function applySettings(){ const st = (S && S.settings) || {}; ROLLOVER_H = st.rollover || 0; try { document.documentElement.setAttribute('data-mode', st.theme === 'dark' ? 'dark' : 'light'); } catch(e){} }
function applyStatMeta(){ applySettings();
  const used = new Set();
  SK.forEach(k => {
    const m = (S && S.statMeta && S.statMeta[k]) || {};
    Object.assign(STATS[k], STATS_BASE[k], m);
    let ab = ABBR[k];
    if (m.name){
      const L = m.name.toUpperCase().replace(/[^A-Z0-9]/g,'');
      const tries = [L.slice(0,3)]; for (let i=2;i<L.length;i++) tries.push(L[0] + L[1] + L[i]); for (let i=1;i<L.length;i++) tries.push(L[0] + L[i] + (L[i+1]||'X'));
      ab = tries.find(t => t.length === 3 && !used.has(t) && !SK.some(o => o !== k && ABBR[o] === t)) || ABBR[k];
    }

  });

function cleanStatMeta(sm){

    if (STAT_COLORS.includes(m.c)) o.c = m.c;
    if (STAT_ICONS.includes(m.icon)) o.icon = m.icon;
    if (Object.keys(o).length) out[k] = o; }
  return out;
}
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_ORDER = [1,2,3,4,5,6,0];
const DEFAULT_TASKS = [
  {id:'gym',     name:'Gym session',                stats:['MGT'],       cad:'week', target:4, bonus:5},
  {id:'bedstr',  name:'Full-body stretch before bed',stats:['MOB'],      cad:'day'},

// two-handed warrior weapons (long grips, big guards) and the reworked rogue katars, claws and off-hand blades
const gsword = (w, len, o = {}) => {
  const x0 = 9, y0 = 14;                                   // where the blade meets the guard
  const yo = i => o.wave ? Math.round(Math.sin(i*0.9)) : 0;
  for (let i=0;i<len;i++){ const ww = o.taper && i > len - 4 ? Math.max(1, w - (i - (len - 4))) : w; for (let k=0;k<ww;k++){ W_(x0+i+k, y0-i-yo(i)); W_(x0+i+k, y0-i+1-yo(i)); } }
  W_(x0+len+Math.floor(w/2), y0-len-yo(len));              // point
  if (w >= 3) for (let i=2;i<len-2;i++) B_(x0+i+Math.floor(w/2), y0-i-yo(i));   // fuller
  if (o.teeth) for (let i=1;i<len-2;i+=2) W_(x0+i+w, y0-i);   // serrated back edge
  for (let t=-3;t<=3;t++){ W_(x0-1+t, y0+1+t, 2, 1); W_(x0+t, y0+2+t, 1, 1); }      // crossguard
  if (o.curl){ W_(x0-5, y0-3, 2, 2); W_(x0+3, y0+5, 2, 2); }
  for (let t=0;t<5;t++) W_(x0-3-t, y0+3+t, 2, 2);          // long two-hand grip
  for (const t of [1,3]) B_(x0-3-t, y0+3+t);
  disc(x0-9, y0+9, 1, PW);                                   // pommel
};
const katar = (len, hw0, o = {}) => {
  const G = [9, 13];
  for (let s2=0;s2<=len;s2++){ const hw = Math.max(0, Math.round(hw0 * (1 - s2/len))); for (let j=-hw;j<=hw;j++){ const x = G[0] + s2 + j, y = G[1] - s2 + j; W_(x, y); W_(x+1, y); } }
  if (o.notch) for (const s2 of o.notch){ const x = G[0] + s2 + hw0 - 1, y = G[1] - s2 + hw0 - 1; B_(x, y); B_(x+1, y); }
  if (hw0 >= 2) for (let s2=1;s2<len-2;s2++) B_(G[0] + s2, G[1] - s2);   // center ridge
  wline(G[0]-4, G[1]-4, G[0]+4, G[1]+4);                     // guard across the blade's base
  wline(G[0]-4, G[1]-4, G[0]-10, G[1]+2); wline(G[0]+4, G[1]+4, G[0]-2, G[1]+10);   // the two side bars
  wline(G[0]-8, G[1], G[0]-4, G[1]+4); wline(G[0]-7, G[1]+1, G[0]-3, G[1]+5);       // the grip you punch with
};

// the altar in 1-bit pixels: a stepped stone plinth with a carved glyph, a keystone slot, and a rune stone floating above
function drawAltar(cv, bob, glow, open){
  const g = cv.getContext('2d'); g.clearRect(0, 0, 32, 32); g.fillStyle = PW;
  const P = (x, y, w = 1, h = 1) => g.fillRect(x, y, w, h), H = (y, a, b) => P(a, y, b - a + 1, 1), V = (x, a, b) => P(x, a, 1, b - a + 1);
  if (glow) { g.fillStyle = STAR_PINK; for (let y = 0; y < 14; y++) for (let x = 4; x < 28; x++) if ((x + y) % 4 === 0 && Math.hypot(x - 16, (y - 7) * 1.2) < 10 && Math.hypot(x - 16, (y - 7) * 1.2) > 5.5) P(x, y); g.fillStyle = PW; }
  // a stepped base, a carved column with the keystone slot, and a top slab
  H(29, 4, 27); V(4, 27, 29); V(27, 27, 29); H(27, 4, 27);
  H(26, 7, 24); V(7, 24, 26); V(24, 24, 26); H(24, 7, 24);
  V(11, 16, 23); V(20, 16, 23);
  H(15, 8, 23); H(13, 8, 23); V(8, 13, 15); V(23, 13, 15);
  P(14, 18, 4, 1); P(14, 18, 1, 4); P(17, 18, 1, 4); P(14, 21, 4, 1); if (open) P(15, 19, 2, 2);   // the keystone slot
  P(13, 17, 1, 1); P(18, 17, 1, 1); P(13, 23, 1, 1); P(18, 23, 1, 1);
  // the floating rune stone: a diamond with a glyph
  const cy = 7 + bob;
  for (let i = 0; i <= 4; i++){ H(cy - 4 + i, 16 - i, 15 + i); H(cy + 4 - i, 16 - i, 15 + i); }
  g.clearRect(15, cy - 2, 2, 1); g.clearRect(14, cy, 4, 1); g.clearRect(15, cy + 2, 2, 1); g.clearRect(15, cy - 1, 1, 3);
}
function drawAltarIcons(root){ (root || document).querySelectorAll('canvas.altaricon, canvas.altarbig').forEach(cv => { if (!cv.closest('.altarbox')) drawAltar(cv, 0, false, false); }); }
function openAltarUI(key, outcome){
  const el = document.getElementById('award'); if (!el) return;
  const leg = outcome.kind === 'legendary', left = D.altar.keys.length, lr = leg ? LRUNE_BY[outcome.id] : null;
  const prize = leg ? `<span class="kick legk">Legendary rune!</span>${itemArt({...lr, kind:'lrune'})}<b class="awn">${esc(lr.name)}</b><p class="how">${esc(lr.text)}. It's yours for good: equip it in the ✦ slot in Inventory.</p>`
    : `<span class="kick">The altar answers</span><b class="awn chestgain">${outcome.kind === 'gold' ? '<i class="gdot"></i>' : ''}+${outcome.n} ${outcome.kind === 'gold' ? 'G' : outcome.kind === 'xp' ? 'XP' : 'MP'}</b>`;
  el.innerHTML = `<div class="awardin chestbox altarbox" role="dialog" aria-modal="true" aria-label="Rune Altar">
    <span class="kick">Rune Altar</span><canvas class="chestbig" width="32" height="32" aria-hidden="true"></canvas><p class="how altarmsg">Meditating…</p>
    <div class="chestprize" hidden>${prize}
      <div class="row" style="gap:8px;justify-content:center;margin-top:6px">${leg ? `<button class="btn primary" data-altardone>Wonderful</button>` : `<button class="btn" data-altardone>Nice</button>${left ? `<button class="btn primary" data-meditate>Meditate again (${left})</button>` : ''}`}</div></div></div>`;
  el.hidden = false; drawIcons(el);
  document.querySelectorAll('.app, .nav').forEach(n => n.inert = true);
  const cv = el.querySelector('.chestbig'), box = el.querySelector('.chestprize'), msg = el.querySelector('.altarmsg');
  const reveal = () => { drawAltar(cv, 0, leg, true); if (msg) msg.hidden = true; box.hidden = false; starburst(cv.getBoundingClientRect(), leg); if (leg && typeof confetti === 'function') confetti(cv.getBoundingClientRect()); const b = box.querySelector('button.primary, button'); if (b) b.focus(); };
  if (!motionOK){ reveal(); return; }
  // the keystone settles into the plinth, the stone bobs and orbiting pixels gather, then it answers (longer for a legendary)
  const t0 = performance.now(), wait = leg ? 2.2 : 1.3, g = cv.getContext('2d');
  const step = now => {
    const t = (now - t0) / 1000; if (!cv.isConnected) return;
    if (t < wait){
      drawAltar(cv, Math.round(Math.sin(t * 4) * 1), leg && t > 1 && Math.sin(t * 20) > -0.3, t > 0.3);
      const n = 6, r = Math.max(3, 11 - t / wait * 7); g.fillStyle = PW;
      for (let i = 0; i < n; i++){ const a = t * (3 + t) + i * Math.PI * 2 / n; g.fillRect(Math.round(16 + Math.cos(a) * r), Math.round(7 + Math.sin(a) * r * 0.7), 1, 1); }
      requestAnimationFrame(step);
    } else reveal();
  };
  requestAnimationFrame(step);
}

// draws the pixel chest in the app's black-and-white pixel style: closed, or open with light spilling out
function drawChest(cv, open, shake, glow){

  const g = cv.getContext('2d'); g.clearRect(0, 0, 32, 32); g.fillStyle = PW;
  const P = (x, y) => g.fillRect(x + shake, y, 1, 1), H = (y, a, b) => { for (let x = a; x <= b; x++) P(x, y); }, V = (x, a, b) => { for (let y = a; y <= b; y++) P(x, y); };

  H(22, 10, 21);

    H(5, 6, 25); V(5, 6, 15); V(26, 6, 15); H(6, 5, 5); H(6, 26, 26);
    for (const x of [8, 9, 22, 23]) V(x, 6, 15);
    // treasure heaped inside
    H(16, 6, 25); H(15, 7, 11); H(15, 14, 18); H(15, 20, 24); H(14, 9, 10); H(14, 15, 17); H(14, 21, 22); P(16, 13);

    for (const [x, y] of [[13, 1], [15, 0], [18, 1], [11, 3], [20, 3], [16, 2]]) P(x, y);

let resetArmed = false, restoreArmed = false;
const BAK_KEY = LS_KEY + '.bak';
// which task checklists are open: a view setting for this device only, so it never touches the save
const CL_OPEN_KEY = 'oathkeeper-clopen';
var clOpen = (() => { try { return new Set(JSON.parse(localStorage.getItem(CL_OPEN_KEY) || '[]').filter(x => typeof x === 'string').slice(0, 200)); } catch(e){ return new Set(); } })();
var gistOffArmed = false, gistHist = null, gistHistArm = null, gistHistBusy = false;
const hasBak = () => { try { return !!localStorage.getItem(BAK_KEY); } catch(e){ return false; } };
const backup = () => { if (recoveryMode) return; try { localStorage.setItem(BAK_KEY, JSON.stringify(S)); } catch(e){} };
let recoverArm = null;
function enterRecovery(reason){
  if (!recoveryMode){
    recoveryMode = true;
    try { const prev = localStorage.getItem(LS_KEY + '.failed'); if (prev) localStorage.setItem(LS_KEY + '.failed.prev', prev); localStorage.setItem(LS_KEY + '.failed', JSON.stringify(S)); } catch(e){}
  }
  if (!recoveryReason) recoveryReason = reason || '';
  try { const aw = document.getElementById('award'); if (aw){ aw.hidden = true; aw.innerHTML = ''; } document.querySelectorAll('.app, .nav').forEach(n => n.inert = false); } catch(e){}
  clearTimeout(saveTimer); cloud.pending = false;
  if (!document.getElementById('sheet').hidden){ document.getElementById('sheet').hidden = true; document.querySelectorAll('.app, .nav').forEach(n => n.inert = false); }
}
function showRecovery(){
  const top = document.getElementById('top'); if (top) top.innerHTML = '<div><span class="eyebrow">Recovery</span><h1>Paused</h1></div>';
  const v = document.getElementById('view'); if (!v) return;
  v.innerHTML = `<div class="card" style="display:flex;flex-direction:column;gap:12px">
    <span class="sname">Something went wrong, so the app paused</span>
    <p class="how">Your save hasn't been changed or erased. Nothing can be checked off or saved until you reload, so no progress gets lost. You can copy your save first if you like.</p>
    <div class="row"><button class="btn" data-copy>Copy current save</button><span class="small muted" id="copyMsg"></span></div>
    ${hasBak() ? '<div class="row"><button class="btn" data-copybak>Copy previous save</button><span class="small muted" id="copyBakMsg"></span></div>' : ''}
    <div class="row"><button class="btn primary" data-reload>Reload</button></div>
    <p class="how small">Still stuck after reloading?</p>
    ${hasBak() ? `<div class="row"><button class="btn" data-usebak>${recoverArm === 'usebak' ? 'Tap again to switch to your previous save' : 'Use previous save'}</button></div>` : ''}
    <div class="row"><button class="btn danger" data-fresh>${recoverArm === 'fresh' ? 'Tap again to start fresh' : 'Start fresh'}</button></div>
    <p class="how small">Either option keeps a copy of the current save on this device.</p>
    ${recoveryReason ? `<p class="how small">Details: ${esc(String(recoveryReason)).slice(0,160)}</p>` : ''}</div>`;
}
function render(){
  if (recoveryMode){ showRecovery(); return; }
  try { renderInner(); musicSync(); }
  catch(err){ console.error(err); enterRecovery(String(err && err.message || err)); showRecovery(); }
}
function renderInner(){
  D = derive();
  if (PREVIEW && !(S.testGold || []).length){ S.testGold = [{ts: Date.now(), g: 2000}]; save(true); D = derive(); toast('Preview: 2000 test gold added'); }
  if (S.equip.hat && ITEM[S.equip.hat] && ITEM[S.equip.hat].boss && !D.drops.has(S.equip.hat)){ setHat(null); save(true); D = derive(); }
  // prize gear you no longer own (the win was undone) comes off too
  for (const sl of Object.keys(S.gear)){ const g = GEAR_BY[S.gear[sl]]; if (g && g.boss && !D.drops.has(g.id)){ S.gear[sl] = null; S.gearLog.push({ts: Date.now(), slot: sl, id: null}); save(true); D = derive(); } }
  if (!S.stepFrom && !recoveryMode){ S.stepFrom = D.today; save(true); D = derive(); }
  if (!S.chestFrom && !recoveryMode){ S.chestFrom = Date.now(); save(true); D = derive(); }
  // the equip slots arrived after skills: whatever you'd learned fills them first, best skills first, for free
  if (!Array.isArray(S.skillEq) && !recoveryMode){ S.skillEq = SKILLS.filter(sk => S.skills[sk.id]).sort((a, b) => (S.skills[b.id] - S.skills[a.id]) || (b.unlock - a.unlock)).slice(0, SKILL_SLOTS).map(sk => sk.id); save(true); D = derive(); }
  // habit mastery counts from the start of the week it arrived, so this week's check-offs already count
  // hand rules arrived: from now on two-handers empty the off hand and rogue weapons only pair with a blade
  if (!S.gearRev && !recoveryMode){ S.gearRev = Date.now();
    if (S.gear.weapon && S.gear.offhand && offhandBlock(S.gear.weapon, S.gear.offhand)){ const nm = (GEAR_BY[S.gear.offhand] || {}).name; S.gear.offhand = null; S.gearLog.push({ts: S.gearRev, slot:'offhand', id:null}); setTimeout(() => toast(`Your ${GEAR_BY[S.gear.weapon].name} now takes the off hand too, so your ${nm} went back to your bag`), 600); }
    save(true); D = derive(); }
  if (!S.balRev && !recoveryMode){ S.balRev = Date.now(); save(true); D = derive(); }   // the build balance pass counts from now on
  if (!S.habitFrom && !recoveryMode){ S.habitFrom = weekKey(D.today); S.habitWk = 1; save(true); D = derive(); }
  if (S.habitFrom && !S.habitWk && !recoveryMode){ S.habitFrom = weekKey(S.habitFrom); S.habitWk = 1; save(true); D = derive(); }
  if (!S.altarFrom && !recoveryMode){ S.altarFrom = Date.now(); save(true); D = derive(); }   // the Rune Altar opens only after bosses beaten from now on
  if (D.altar.wins.length && !recoveryMode){ D.altar.wins.forEach(w => { if (!S.lrunes[w.id]) S.lrunes[w.id] = w.key; }); save(true); D = derive(); }   // legendary runes are kept for good   // Focus chests start with sessions finished from now on   // partial-progress pay starts the day this build first ran, never earlier
  if (S.seenInit === false){ S.seenDrops = Array.from(new Set([...S.seenDrops, ...[...D.drops].filter(id => ITEM[id] && ITEM[id].boss)])); S.seenInit = true; save(true); D = derive(); }
  for (const c of Object.keys(S.results)) if (+c >= D.freezeBefore) delete S.results[c];
  const nr = Object.keys(D.newResults || {}).filter(c => !S.results[c]);

    if (S.pickLog[k]){ const p = S.pickLog[k][id]; if (p) (S.picks[k] || (S.picks[k] = {}))[id] = p; delete S.pickLog[k][id]; if (!Object.keys(S.pickLog[k]).length) delete S.pickLog[k]; }
    if (S.snap[k]){ delete S.snap[k][id]; if (!Object.keys(S.snap[k]).length) delete S.snap[k]; }
    const chk = derive();
    const lock = undoLock(chk, before);
    if (lock){
      const o = JSON.parse(saved);
      for (const [key, val] of [['log',o.log],['pickLog',o.pl],['snap',o.sn],['picks',o.pk]]){ if (val) S[key][k] = val; else delete S[key][k]; }
      toast(lock);
      return;
    }
  } else {
    if (!task || offOn(task, k) || !isDue(task, k) || waived(k, id)) return;   // closed, rested or retired today
    completing = true;
    const first = (S.firstTs[k] || {})[id];
    // a yesterday task on the day you checked in lands after check-in, so it can't skip past the Inn
    const innSt = (S.inn || []).find(st => st.from === k && st.ts);
    const ts = first || (vday === 'today' ? Date.now() : Math.max(parseKey(k).setHours(21,0,0,0), innSt ? innSt.ts + 1 : 0));
    (S.firstTs[k] || (S.firstTs[k] = {}))[id] = ts;
    for (const d of Object.keys(S.firstTs)) if (d < D.yest) delete S.firstTs[d];
    (S.log[k] || (S.log[k] = {}))[id] = ts;
    let stats = task ? task.stats : ['MGT'];
    if (task && task.pool && task.pool.length){ const p = pickFor(task, k); stats = p.stats; (S.pickLog[k] || (S.pickLog[k] = {}))[id] = {n:p.name, s:p.stats.slice()}; }
    if (task) (S.snap[k] || (S.snap[k] = {}))[id] = snapOf(task, stats, k);
  }
  save();
  const after = derive();
  const dx = after.xp - before.xp, dg = after.balance - before.balance, mWas = before.mini && after.minis.find(x => x.from === before.mini.from), dd = after.cur.dmg - before.cur.dmg + (mWas ? mWas.dmg - before.mini.dmg : 0), mWon = miniBeaten(before, after);
  const r = el.getBoundingClientRect();
  render();
  if (recoveryMode) return;
  if (completing) confetti(r);
  const keyGain = !mWon && after.altar.keys.length > before.altar.keys.length;
  if (keyGain){ floatAt(r.left + r.width/2, r.top, `<span style="color:var(--gold)">+1 Keystone</span>${dx > 0 ? `  <span style="color:var(--accent)">+${dx} XP</span>` : ''}`); jumpUntil = Date.now() + 700; }
  else if (dx > 0){
    floatAt(r.left + r.width/2, r.top, `<span style="color:var(--accent)">+${dx} XP</span>  <span style="color:var(--gold)">+${dg} G</span>${dd>0 && (before.cur.status==='now' || before.mini) ? `<br><span style="color:var(--hp)">-${dd} HP</span>` : ''}`);
    jumpUntil = Date.now() + 700; if (dd > 0) hurtUntil = Date.now() + 500;
  }
  if (after.lv.level > before.lv.level){ toast(stage(after.lv.level) > stage(before.lv.level) ? `Level ${after.lv.level}! ${S.petName} evolved.` : `Level ${after.lv.level}!`); }
  else if (after.cur.status === 'won' && before.cur.status === 'now'){ toast(`${after.cur.boss.name} defeated! +${BOSS_REWARD(after.cur.boss)} G and ${dropName(after.cur.boss)}`); }
  else if (mWon) toast(mWon);
  else { const t = S.tasks.find(x => x.id === id); if (t && t.cad === 'week' && dx > 0 && weekCount(id,k) === effTarget(t,k)) toast(`Weekly goal hit: ${t.name}. +30 G chest`); }
  const bm = document.getElementById('bossmini'); if (bm && dd > 0){ bm.classList.remove('shake'); void bm.offsetWidth; bm.classList.add('shake'); }
}

// put a piece of gear on (or take it off with id null); a two-hander empties the off hand and a rogue weapon only keeps a blade there.
// Returns the name of anything that had to come off the off hand.
function wearGear(it, next){
  const now = Date.now(); let freed = '';
  S.gear[it.slot] = next; S.gearLog.push({ts: now, slot: it.slot, id: next});
  if (next && it.slot === 'weapon' && S.gear.offhand && offhandBlock(next, S.gear.offhand)){ freed = (GEAR_BY[S.gear.offhand] || {}).name || ''; S.gear.offhand = null; S.gearLog.push({ts: now, slot: 'offhand', id: null}); }
  return freed;
}
// try to run from the mini-boss: one try a day, fixed by the day so it can't be re-rolled
function runAway(pot){
  if (recoveryMode || !D.mini) return;
  if (D.ranToday){ toast('You already tried to run today'); return; }
  if (pot && !(D.bag.pot_agi > 0)){ toast('No Agility Potion in your bag'); return; }
  const rune = D.activeRunes.some(r => r.id === 'rune_agi'), odds = pot ? RUN_POT : rune ? RUN_RUNE : RUN_ODDS, from = D.mini.from, name = D.mini.m.name, ts = Date.now();
  const ok = roll('run|' + from + '|' + D.today) < odds, g = ok && !pot && !rune ? Math.floor(Math.max(0, D.balance) * RUN_STEAL) : 0;
  if (pot) S.potions.push({id: 'pot_agi', ts, date: D.today, g: 0, bag: true});
  S.runs.push({from, d: D.today, ts, odds, ok, ...(g ? {g} : {})}); save(); render();
  toast(ok ? `You got away from the ${name}!${g ? ` It grabbed ${g} G on your way out.` : ''}` : `The ${name} blocks your way. Try again tomorrow.`);
}
// the message for a mini-boss beaten between two states, or ''
function miniBeaten(before, after){
  if (!before.mini) return ''; const m = after.minis.find(x => x.from === before.mini.from && x.status === 'won');
  return m ? `${m.m.name} beaten! +${m.g} G, +${m.xp} XP and ${m.prize === 'keys' ? '3 Keystones' : '3 Focus chests'}` : '';
}
function cast(id, el){
  const sk = SKILL_BY[id], st = D.skills[id], k = D.today;
  if (!st || !st.ready || !st.l) return;
  if (!skillEqd(id)){ toast(`Equip ${sk.name} first`); return; }
  if (!skillGearOk(sk)){ toast(`${sk.name} needs a ${STYLES[sk.branch].name} build`); return; }
  const use = {id, ts: Date.now(), date: k, cost: st.cost};
  let msg = '';
  if (sk.kind === 'dmg'){ if ((D.cur.status !== 'now' && !D.mini) || D.inn) return; use.dmg = st.power; msg = `${sk.name}: ${st.power} damage to ${D.cur.status === 'now' ? D.cur.boss.name : D.mini.m.name}`; }
  if (sk.kind === 'buff'){
    if (D.activeBuffs.some(u => u.id === id)){ toast(`${sk.name} is already active`); return; }
    use.buff = {st: {[sk.stat]: sk.amt(st.l)}, days: sk.days};
    msg = `${sk.name}: +${sk.amt(st.l)} ${STATS[sk.stat].name} for ${sk.days} days`;
  }
  // backstop: replay the day with this cast and refuse it if MP would run short anywhere
  S.skillLog.push(use); const chk = derive(); S.skillLog.pop();
  if (chk.castDeficit > D.castDeficit){ toast('Not enough MP'); return; }
  if (id === 'wind' || id === 'lighten'){
    const sel = document.getElementById('sel-' + id); const tid = sel && sel.value; if (!tid) return;
    const t = S.tasks.find(x => x.id === tid); if (!t) return;
    use.task = tid;
    if (id === 'wind'){ (S.waives[k] || (S.waives[k] = {}))[tid] = true; msg = `${t.name} is rested for today`; }
    else { const wk = weekKey(k); const m = S.lightens[wk] || (S.lightens[wk] = {}); m[tid] = (m[tid]||0) + 1; msg = `${t.name}: target is ${effTarget(t,k)} this week`; }
  }
  if (id === 'sanct'){ (S.waives[k] || (S.waives[k] = {}))['*'] = true; msg = 'Sanctuary: today is a rest day'; }
  const before = D;
  S.skillLog.push(use); save();
  const r = el.getBoundingClientRect();
  render();
  if (recoveryMode) return;
  if (use.dmg){ floatAt(r.left + r.width/2, r.top, `<span style="color:var(--hp)">-${use.dmg} HP</span>`); hurtUntil = Date.now() + 600; }
  else { floatAt(r.left + r.width/2, r.top, `<span style="color:var(--accent)">${esc(sk.name)}</span>`); jumpUntil = Date.now() + 700; }
  if (D.cur.status === 'won' && before.cur.status === 'now') toast(`${D.cur.boss.name} defeated! +${BOSS_REWARD(D.cur.boss)} G and ${dropName(D.cur.boss)}`);
  else if (miniBeaten(before, D)) toast(miniBeaten(before, D));
  else toast(msg);
}

/* ---------- focus timer clock: finishes sessions even if you were on another tab or away ---------- */
function pomoTick(){
  let changed = false, guard = 0;
  while (guard++ < 10){
    const r = S.pomo && S.pomo.run; if (!r || r.idle || r.pauseAt) break;
    const dur = pomoMins(r.phase, r) * 60000 + (r.extra || 0), end = r.startTs + r.pausedMs + dur;
    if (Date.now() < end) break;
    if (r.phase === 'focus'){
      S.pomoLog.push({ts: end, mins: r.mins || S.pomo.cfg.focus});
      const n = r.n + 1;
      S.pomo.run = {phase: n % S.pomo.cfg.every === 0 ? 'long' : 'short', startTs: end, pausedMs: 0, pauseAt: null, n};
      toast((r.mins || S.pomo.cfg.focus) >= POMO_MIN ? 'Focus session done! You earned a Focus chest.' : 'Focus session done! Break time.'); sfx('focusDone'); buzz([200, 100, 200, 100, 400]);
    } else {
      // breaks end in a ready state: the next focus block never starts on its own
      S.pomo.run = {phase:'focus', startTs:0, pausedMs:0, pauseAt:null, n: r.phase === 'long' ? 0 : r.n, idle:true};
      lofiIdleUntil = end + 10 * 60000;   // the break music keeps going while the timer waits for you
      toast('Break over. Ready when you are.'); sfx('breakDone'); buzz([150, 80, 150]);
    }
    changed = true;
  }
  if (changed && !recoveryMode){ save(); render(); }
  else if (tab === 'focus') updateFocusClock();
}
