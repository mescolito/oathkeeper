<html lang="en">
<head>
<meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Outfit:wght@400;500;600;700;800&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one phone column on warm cream. 1-bit pixel "game windows" sit in black rounded cards; everything else is soft pastel UI with black pills and a floating black tab bar. Single light theme by choice. */
  --bg:#f6f1e6;
  --card:#fffbf3;
  --ink:#171614;
  --muted:#6b665b;
  --line:#e9e1d1;
  --track:#ece4d3;
  --yellow:#f2d982; --sage:#a9b97c; --pink:#eeb7d8; --blue:#b8c9ef; --peach:#f4bf92;
  --accent:#d6eab0; --gold:#f2d982; --hp:#ffa8cf; --hpc:#e98a9a; --inv:#ffffff;
  --pastel-ink:#171614;
  --sans:"Outfit", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --pixel:"Silkscreen", ui-monospace, "Courier New", monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding:18px 18px 120px;display:flex;flex-direction:column;gap:18px}
h1,h2{margin:0;text-wrap:balance}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:2px}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.5px}
.goldpill{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:9px 14px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;flex:none}
.goldpill i{width:10px;height:10px;border-radius:50%;background:var(--yellow);display:block}
.muted{color:var(--muted)}
.small{font-size:13px}
.how{font-size:13.5px;color:var(--muted);margin:0;line-height:1.45}

/* 1-bit game windows */
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;width:100%}
.game{background:#141312;border-radius:28px;padding:10px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(23,22,20,.18)}
.game canvas{border-radius:18px;aspect-ratio:64/44}
.game.boss canvas{aspect-ratio:64/52}
.dlg{border:2px solid #f1eee4;padding:2px;border-radius:4px}
.dlg-in{border:1px solid #f1eee4;padding:9px 11px;color:#f1eee4;font-family:var(--pixel);font-size:11px;line-height:1.5;display:flex;flex-direction:column;gap:6px}
.dlg-h{display:flex;justify-content:space-between;gap:10px;text-transform:uppercase;font-size:12px}
.dlg p{margin:0}
.dlg-bars{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 8px;align-items:center;font-size:10px}
.bitbar{height:8px;border:1px solid #f1eee4;padding:1px;display:block}
.bitbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,#f1eee4 0 3px,transparent 3px 4px)}

/* score ring */
.ring{position:relative;width:min(300px,82vw);margin:0 auto;aspect-ratio:1}
.ring svg{width:100%;height:100%;display:block;overflow:visible}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ring .center b{font-size:76px;font-weight:700;line-height:.9;letter-spacing:-3px;font-variant-numeric:tabular-nums}
.ring .center span{color:var(--muted);font-size:14px;font-weight:500;margin-top:8px}
.actions{display:flex;gap:10px;align-items:center;justify-content:center}
.seg{display:inline-flex;background:var(--ink);border-radius:999px;padding:4px}
.seg button{background:none;border:0;color:#bdb6a8;padding:9px 16px;min-height:44px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink)}
.iconbtn{width:48px;height:48px;border-radius:50%;border:0;background:#ece5d6;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}

/* assistant card */
.assist{display:grid;grid-template-columns:1fr 92px;gap:12px;align-items:center;background:var(--pink);border:0;border-radius:26px;padding:16px 16px 16px 18px;text-align:left;cursor:pointer;width:100%}
.assist .k{font-size:12.5px;font-weight:600;opacity:.75}
.assist p{margin:4px 0 12px;font-size:17px;font-weight:600;line-height:1.3}
.assist .pillbtn{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.assist canvas{border-radius:16px;background:#141312;padding:4px;aspect-ratio:64/52}

/* sections + tasks */
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.sec-h h2{font-size:22px;font-weight:700;letter-spacing:-.3px}
.count{background:var(--ink);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:46px 1fr 44px;gap:12px;align-items:center;background:var(--card);border-radius:22px;padding:12px 12px 12px 12px;box-shadow:0 1px 0 var(--line)}
.ticon{width:46px;height:46px;min-width:46px;flex:none;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ticon svg{flex:none}
.temoji{font-size:24px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.iconpick .temoji{font-size:20px}
.emojirow{display:flex;gap:8px;align-items:center}
.emojirow input{flex:1;font-size:20px}
.statlv{flex:none}
.tbody{display:flex;flex-direction:column;gap:5px;min-width:0}
.tkick{font-size:12px;font-weight:600;color:var(--muted)}
.tname{font-size:16.5px;font-weight:600;line-height:1.25}
.trow.done .tname{color:var(--muted)}
.tmeta{display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;font-size:13px;color:var(--muted)}
.chip-s{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:var(--ink)}
.chip-weak{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ink);color:#fff}
.wk{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.wkn{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wkn b{font-size:18px;color:var(--ink);font-weight:700}
.pbar{display:block;height:9px;border-radius:999px;background:var(--track);overflow:hidden;flex:1}
.pbar i{display:block;height:100%;border-radius:999px;background:var(--ink)}
.pbar.thick{height:14px}
.check{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:transparent;color:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}
.check:active{transform:scale(.92)}
.trow.done .check{background:var(--ink);color:#fff}
.check[disabled]{opacity:.3;cursor:default}
.trow.rested{opacity:.7}
.trow.rested .check{border-style:dashed}
.cl{grid-column:1/-1;margin:2px -12px -12px;border-top:1px solid var(--line);border-radius:0 0 22px 22px;overflow:hidden}
.clhead{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 22px 8px 12px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.clhead .pbar{flex:0 0 46px;height:7px}
.clchev{display:inline-flex;color:var(--muted);margin-left:auto}
.cllist{display:flex;flex-direction:column;padding:4px 12px 0}
.clitem{display:grid;grid-template-columns:1fr 44px;gap:12px;align-items:center;min-height:52px;padding-left:58px}
.cltext{font-size:15px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.clitem.on .cltext{color:var(--muted);text-decoration:line-through}
.clcheck{width:30px;height:30px;margin:0 7px;border-radius:8px;border:2px solid var(--ink);background:transparent;color:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;justify-self:center}
.clitem.on .clcheck{background:var(--pink);border-color:var(--pink);color:#171614}
.clcheck[disabled]{opacity:.3;cursor:default}
.rrmore{display:inline-flex;align-items:center;gap:4px;min-height:44px;border:0;background:transparent;color:var(--muted);font-size:12.5px;cursor:pointer;padding:0 4px}
.rrmore .clchev{margin-left:0}
.rrlist{flex-basis:100%;line-height:1.4}
.rr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.rrbtn{display:inline-flex;align-items:center;gap:5px;border:0;background:#efe7d6;border-radius:999px;padding:5px 12px;min-height:44px;font-size:12.5px;font-weight:600;cursor:pointer}
.rrbtn[disabled]{opacity:.45;cursor:default}

/* generic cards, buttons */
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 1px 0 var(--line)}
.btn{background:#ece5d6;border:0;border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer;line-height:1.2}
.btn.primary{background:var(--ink);color:#fff}
.btn.gold{background:var(--yellow)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
.btn.danger{background:transparent;color:#b5413c;box-shadow:inset 0 0 0 2px #e3a9a6}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px 14px;font-size:15px}
.kv b{font-weight:500;color:var(--muted)}
.kv span{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.loadout{grid-template-columns:auto 1fr}
.loadout span{text-align:left}
.bignum{display:flex;align-items:baseline;gap:8px}
.bignum b{font-size:56px;font-weight:700;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.bignum span{color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:12px 14px;font-size:15px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#ece5d6}
.pill.won{background:var(--sage)} .pill.lost{background:#f1c9c6} .pill.now{background:var(--yellow)} .pill.next{background:#ece5d6}
.skill{background:var(--card);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 var(--line)}
.skill.locked{opacity:.5}
.skill.ready{box-shadow:inset 0 0 0 2px var(--ink)}
.sname{font-size:17px;font-weight:700}
.kind{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.kind.relief{background:var(--sage)} .kind.dmg{background:var(--pink)} .kind.buff{background:var(--blue)}
.lvpips{display:inline-flex;gap:5px}
.lvpips i{width:10px;height:10px;border-radius:50%;background:var(--track)}
.lvpips i.on{background:var(--ink)}
.lbl{font-size:12px;font-weight:700;color:var(--muted);width:30px;flex:none}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:var(--card);border-radius:22px;padding:8px 8px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 0 var(--line)}
.item canvas{border-radius:15px;background:#141312}
.item canvas.icon{width:64%;margin:6px auto;aspect-ratio:1}
.item canvas.wide{aspect-ratio:64/44}
.item{align-items:stretch}
.item b{font-size:15px;font-weight:600;padding:0 4px}
.item .small{padding:0 4px}
.item .btn{margin-top:auto}
.item.eq{box-shadow:inset 0 0 0 2px var(--ink)}
.erow{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:22px;padding:12px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;color:var(--ink);font-family:var(--sans);font-size:16px;padding:11px 12px}
textarea{min-height:90px;font-size:13px}
.filebtn{position:relative;cursor:pointer;display:inline-flex;align-items:center}.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 12px;min-height:44px;min-width:44px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{border-color:transparent}
.opt{display:flex;flex-direction:column;gap:8px;padding:10px;background:#f4eee2;border-radius:16px}
.opt .row input{flex:1}
.checkrow{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;cursor:pointer}
.checkrow{min-height:44px}
.checkrow input{width:24px;height:24px;accent-color:var(--ink);flex:none}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:#cfc6b4;flex:none}
.sync.ok i{background:#7fa35a}

/* shop filters, stats panel */
.filters{display:flex;flex-direction:column;gap:10px}
.catpills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.catpills::-webkit-scrollbar{display:none}
.catpill{flex:none;border:0;background:#ece5d6;border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer}
.catpill.on{background:var(--ink);color:#fff}
.seg.wide{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
.seg.wide button{padding:9px 6px}
.sheet .panel > *{flex-shrink:0}
.statcard{background:var(--card);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 var(--line)}
.statcard.editing{box-shadow:inset 0 0 0 2px var(--ink)}
.statlv{display:flex;flex-direction:column;align-items:center;margin-left:auto}
.statlv b{font-size:30px;font-weight:700;line-height:1;white-space:nowrap}
.statlv .plus{font-style:normal;font-size:18px;font-weight:700;color:#4f7a22;margin-left:3px}
html[data-mode="dark"] .statlv .plus{color:#b9d98a}
.statlv span{font-size:11px;color:var(--muted);font-weight:600}
.statsum{display:flex;flex-direction:column;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:44px;height:44px;border-radius:50%;border:0;cursor:pointer}
.swatch.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.iconpick{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconpick.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sec-h > div h2{line-height:1.1}
#view{width:100%;min-width:0;max-width:100%}
.filters{min-width:0}
.tbody,.tname,.tkick,.rr,.rr span,.tmeta,.item b,.item .small,.tl span,.erow,.statcard .tbody{overflow-wrap:anywhere;min-width:0}

/* dark mode (Settings → General) */
html[data-mode="dark"]{--bg:#141312;--card:#1f1d1a;--ink:#f1ede4;--muted:#a59f92;--line:#2d2a26;--track:#34312c;--inv:#171614;--hpc:#e98a9a;color-scheme:dark}
html[data-mode="dark"] .navin{background:#141312;box-shadow:0 0 0 1px #2d2a26,0 12px 30px rgba(0,0,0,.5)}
html[data-mode="dark"] .navin button[aria-current="page"]{color:#fff}
html[data-mode="dark"] .navin .fab{box-shadow:0 0 0 6px var(--bg)}
html[data-mode="dark"] .goldpill,html[data-mode="dark"] .seg,html[data-mode="dark"] .count,html[data-mode="dark"] .btn.primary,html[data-mode="dark"] .chip-weak,html[data-mode="dark"] .float,html[data-mode="dark"] .toast,html[data-mode="dark"] .assist .pillbtn,html[data-mode="dark"] .catpill.on,html[data-mode="dark"] .iconpick.on{color:var(--inv)}
html[data-mode="dark"] .seg button{color:#77716a}
html[data-mode="dark"] .seg button.on{background:var(--bg);color:var(--ink)}
html[data-mode="dark"] .trow.done .check{color:var(--inv)}
html[data-mode="dark"] .btn,html[data-mode="dark"] .rrbtn,html[data-mode="dark"] .catpill,html[data-mode="dark"] .iconbtn{background:#2d2a26;color:var(--ink)}
html[data-mode="dark"] .btn.primary{background:var(--ink)}
html[data-mode="dark"] .btn.gold{background:var(--yellow);color:#171614}
html[data-mode="dark"] .btn.ghost{background:transparent}
html[data-mode="dark"] .btn.danger{background:transparent;color:#f0a19c}
html[data-mode="dark"] input[type=text],html[data-mode="dark"] input[type=password],html[data-mode="dark"] input[type=number],html[data-mode="dark"] select,html[data-mode="dark"] textarea,html[data-mode="dark"] .chip,html[data-mode="dark"] .iconpick{background:#171614;color:var(--ink);border-color:#3a3631}
html[data-mode="dark"] .opt{background:#1a1816}
html[data-mode="dark"] .chip-s,html[data-mode="dark"] .ticon,html[data-mode="dark"] .kind,html[data-mode="dark"] .pill,html[data-mode="dark"] .assist,html[data-mode="dark"] .mystery{color:#171614}
html[data-mode="dark"] .pill.next{background:#34312c;color:var(--ink)}
html[data-mode="dark"] .catpill.on{background:var(--ink);color:var(--inv)}
html[data-mode="dark"] .chip-s.plain{color:var(--ink)}
html[data-mode="dark"] .trow.done .check{color:var(--inv)}
/* vitals, statuses, to-dos, potions */
.vitals{display:flex;flex-direction:column;gap:10px}
.vrow{display:grid;grid-template-columns:28px 1fr 74px;gap:12px;align-items:center}
.vlbl{font-size:12px;font-weight:700;color:var(--muted)}
.vnum{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pbar.vbar{height:12px}
.vnum b{color:var(--ink);font-size:15px}
.mppill{background:var(--blue);color:#171614;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.vrow .mppill{grid-column:auto}
.chip-status{background:#f1c9c6;color:#171614;border-radius:999px;padding:3px 10px;font-weight:700;font-size:12px}
.chip-rune{background:var(--blue);color:#171614;border-radius:999px;padding:3px 10px;font-weight:600;font-size:12px}
.chip-streak{background:var(--yellow);color:#171614;border-radius:999px;padding:3px 10px;font-weight:700;font-size:12px}
.chips.small{gap:6px}
.mystery{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--yellow);color:#171614;border-radius:18px;padding:10px 14px;font-size:14px}
.attack{display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.potrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.potbtn{border:0;background:var(--card);border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;cursor:pointer;color:var(--ink);box-shadow:0 1px 0 var(--line);min-height:44px;text-align:center;overflow-wrap:anywhere}
.potbtn canvas{width:32px;height:32px;border-radius:9px;background:#141312}
.potbtn b{font-size:11px;color:var(--muted)}
.potbtn[disabled]{opacity:.45;cursor:default}
.todolist{display:flex;flex-direction:column;gap:10px}
.trow.todo{grid-template-columns:1fr 44px 32px;background:var(--bg)}
.trow.todo.done{grid-template-columns:1fr 44px}
.xbtn{width:32px;height:44px;border:0;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}

.fmusic{cursor:pointer;gap:6px}
.fmusic.on{background:rgba(241,238,228,.92);color:#141312}

.sneed{display:block;font-size:12px;color:#b4555f;margin-top:3px}
.sneed.ok{color:var(--muted)}
.sneed i{font-style:normal;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.05em;background:var(--track);color:var(--ink);border-radius:999px;padding:1px 6px;margin-right:2px}
.fab.badge{position:relative}
.fab.badge::after{content:'';position:absolute;top:7px;right:7px;width:12px;height:12px;min-width:12px;min-height:12px;flex:none;aspect-ratio:1;border-radius:50%;background:#2f5fd0;box-shadow:none;pointer-events:none}
html[data-mode="dark"] .sneed{color:#f0a3ab}

.tree{display:flex;flex-direction:column;gap:14px}
.branch{background:var(--card);border-radius:22px;padding:12px 14px 4px;box-shadow:0 1px 0 var(--line)}
.branch.lean{box-shadow:inset 0 0 0 2px var(--ink)}
.bhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.bhead b{font-size:16px}
.bdot{width:14px;height:14px;border-radius:50%;background:var(--bc);flex:none;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12)}
.leantag{margin-left:auto;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--ink);color:var(--inv);border-radius:999px;padding:2px 8px}
.bnodes{position:relative;padding-left:20px}
.bnodes::before{content:'';position:absolute;left:6px;top:8px;bottom:18px;width:2px;background:var(--bc);border-radius:2px;z-index:0}
.sprow.node{position:relative}
.sprow.node::before{content:'';position:absolute;left:-19px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--bc);z-index:1}
.sprow.node.learned::before{background:var(--bc)}
.leancard{display:flex;align-items:center;gap:12px}

.pill.rite{background:#171614;color:#f1eee4}
html[data-mode="dark"] .pill.rite{background:#f1eee4;color:#171614}

.leanline{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.leanline b{color:var(--ink)}
</style>
</head>

function pomoState(){ const r = S.pomo && S.pomo.run; if (!r || r.idle) return 'idle'; if (r.pauseAt) return 'paused'; return r.phase; }

}

function renderInner(){

  if (S.equip.hat && ITEM[S.equip.hat] && ITEM[S.equip.hat].boss && !D.drops.has(S.equip.hat)){ setHat(null); save(true); D = derive(); }
  // prize gear you no longer own (the win was undone) comes off too
  for (const sl of Object.keys(S.gear)){ const g = GEAR_BY[S.gear[sl]]; if (g && g.boss && !D.drops.has(g.id)){ S.gear[sl] = null; S.gearLog.push({ts: Date.now(), slot: sl, id: null}); save(true); D = derive(); } }

const CONF_PX = 4;
// the app's pastels on dark; deeper versions on the light background so they don't wash out
const CONF_DARK = ['#eeb7d8','#b8c9ef','#f2d982','#a9b97c','#f4bf92','#c9b5ef','#d6eab0'];
const CONF_LIGHT = ['#e08bbd','#8ea7e4','#e5bf4f','#8a9f55','#ec9a5c','#a68ce4','#9fc06a'];
const CONF_RIBBONS = [[[0,0],[1,1],[1,2],[0,3],[0,4],[1,5]], [[0,0],[0,1],[1,2],[2,2],[3,1]], [[1,0],[0,1],[0,2],[1,3]], [[0,0],[1,0],[2,1],[2,2]]];
let conf = null;
// a burst: bits shoot up from the finished task in a V, then drift down slowly and evenly
const CONF_K = 4.2, CONF_G = 240;   // air drag and gravity, in canvas pixels; falling speed settles at G/K
function confRise(v, k){ return v / k - CONF_G / (k * k) * Math.log(1 + k * v / CONF_G); }   // how high a launch speed carries
function confLaunch(h, k){ let lo = 0, hi = 5000; for (let i = 0; i < 24; i++){ const m = (lo + hi) / 2; if (confRise(m, k) < h) lo = m; else hi = m; } return lo; }
function confetti(rect){
  if (!motionOK) return;
  if (!conf){
    const cv = document.createElement('canvas'); cv.className = 'confetti'; cv.setAttribute('aria-hidden', 'true');
    document.body.appendChild(cv);
    conf = {cv, ctx: cv.getContext('2d'), parts: [], last: 0, raf: 0};
  }
  const W = Math.ceil(innerWidth / CONF_PX), H = Math.ceil(innerHeight / CONF_PX);
  if (conf.cv.width !== W || conf.cv.height !== H){ conf.cv.width = W; conf.cv.height = H; }
  // start at the task you ticked, pulled toward the middle so the V opens evenly to both sides
  const bx = rect && (rect.width || rect.height) ? (rect.left + rect.width / 2) / CONF_PX : W / 2;
  const by = rect && (rect.width || rect.height) ? (rect.top + rect.height / 2) / CONF_PX : H * 0.6;
  const ox = W / 2 + (bx - W / 2) * 0.2, oy = Math.max(H * 0.3, Math.min(H * 0.92, by));
  const n = Math.min(130, 300 - conf.parts.length);
  const pal = document.documentElement.getAttribute('data-mode') === 'dark' ? CONF_DARK : CONF_LIGHT;
  for (let i = 0; i < n; i++){
    const ribbon = Math.random() < 0.35;
    // a fan of bits: each one heads for a spot spread evenly across the width and flies up toward the top (a few past it),
    // so the burst opens into a V and then rains back down over the whole screen
    let tx = W * (-0.05 + Math.random() * 1.1); if (Math.abs(tx - ox) < W * 0.06) tx += (tx < ox ? -1 : 1) * W * 0.06;
    const h = Math.min(oy + H * 0.12, oy * (0.45 + Math.random() * 0.7) + Math.abs(tx - ox) * 0.25);
    const k = CONF_K * (0.65 + Math.random() * 0.85);   // some bits catch more air and fall slower, so they spread out on the way down
    conf.parts.push({
      x: ox + (Math.random() - 0.5) * 6, y: oy + (Math.random() - 0.5) * 3,
      vx: (tx - ox) * k, vy: -confLaunch(h, k), k, glide: (Math.random() - 0.5) * 12,
      delay: Math.random() * 0.12,
      sway: Math.random() * 6.28, swaySp: 1.6 + Math.random() * 2.2, swayAmp: 5 + Math.random() * 9,
      spin: Math.random() * 6.28, spinSp: 4 + Math.random() * 7,
      w: 2 + (Math.random() < 0.5 ? 1 : 0), h: 2 + (Math.random() < 0.6 ? 1 : 0),
      shape: ribbon ? CONF_RIBBONS[Math.floor(Math.random() * CONF_RIBBONS.length)] : null,
      color: pal[Math.floor(Math.random() * pal.length)],
      life: 0, ttl: 5.5 + Math.random() * 1.5,
    });
  }
  if (!conf.raf){ conf.last = performance.now(); conf.raf = requestAnimationFrame(confStep); }
}
function confStep(now){
  const c = conf, dt = Math.min(0.05, (now - c.last) / 1000); c.last = now;
  const ctx = c.ctx, W = c.cv.width, H = c.cv.height;
  ctx.clearRect(0, 0, W, H);
  c.parts = c.parts.filter(p => p.life < p.ttl && p.y < H + 8);
  for (const p of c.parts){
    if (p.delay > 0){ p.delay -= dt; continue; }
    p.life += dt;
    p.vx -= p.k * p.vx * dt; p.vy += (CONF_G - p.k * p.vy) * dt;
    p.sway += p.swaySp * dt; p.spin += p.spinSp * dt * (p.vy < 0 ? 2 : 1);
    // the side-to-side flutter only kicks in once it's floating down
    const fall = Math.max(0, Math.min(1, p.vy * p.k / CONF_G)), drift = fall * Math.cos(p.sway) * p.swayAmp, glide = fall * p.glide;
    p.x += (p.vx + drift + glide) * dt; p.y += p.vy * dt;
    ctx.globalAlpha = Math.max(0, Math.min(1, (p.ttl - p.life) / 0.8));
    ctx.fillStyle = p.color;
    const sy = Math.cos(p.spin), flip = Math.sin(p.spin * 0.7) < 0 ? -1 : 1, x = Math.round(p.x), y = Math.round(p.y);
    if (p.shape){
      // the ribbon tumbles: squash it vertically and mirror it, a pixel at a time
      for (const [dx, dy] of p.shape) ctx.fillRect(x + dx * flip, y + Math.round(dy * sy), 1, 1);
    } else {
      // a flat bit seen edge-on is one pixel thin, then opens back up
      const hh = Math.max(1, Math.round(p.h * Math.abs(sy)));
      ctx.fillRect(x, y + Math.round((p.h - hh) / 2), p.w, hh);
    }
  }
  ctx.globalAlpha = 1;
  if (c.parts.length) c.raf = requestAnimationFrame(confStep);
  else { c.raf = 0; c.cv.remove(); conf = null; }
}
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => { t.classList.remove('show'); t.textContent = ''; }, 2600); }

// what an undo is not allowed to take away
function undoLock(chk, before){
  const gearBad = Object.values(S.gear).filter(Boolean).some(g => !GEAR_BY[g] || !(S.owned.includes(g) || chk.drops.has(g)) || !meetsReq(GEAR_BY[g], chk.statLv) || (GEAR_BY[g].lvl && chk.lv.level < GEAR_BY[g].lvl))
    || (S.equip.hat && ITEM[S.equip.hat] && ((ITEM[S.equip.hat].lvl && chk.lv.level < ITEM[S.equip.hat].lvl) || (ITEM[S.equip.hat].boss && !chk.drops.has(S.equip.hat))));
  const spentPts = Object.values(S.skills).reduce((a,b) => a + b, 0);
  const skillBad = spentPts > chk.lv.level || Object.keys(S.skills).some(sid => SKILL_BY[sid].unlock > chk.lv.level || (S.skills[sid] && skillStatOk(SKILL_BY[sid], before.statLv) && !skillStatOk(SKILL_BY[sid], chk.statLv)));
  const tokensUsed = S.runeBuys.filter(r => r.token).length + S.bag.filter(b => b.token).length;
  if (chk.castDeficit > before.castDeficit) return 'Locked in: a skill already used the MP from this.';
  if (chk.balance < 0) return "Locked in: you've already spent the gold from this.";
  if (skillBad) return 'Locked in: your skill points came from this XP.';
  if (gearBad) return 'Locked in: your equipped gear needs this.';
  if (tokensUsed > chk.perfectWeeks) return 'Locked in: your free rune came from this perfect week.';
  return null;
}
// to-do steps remember the day they were ticked, so that day's partial progress can pay out when it ends
// (once per step: a step that's been logged on any day is never logged again)
function tdStepLog(key, on){
  if (on){ if (Object.values(S.stepLog).some(m => m[key])) return; (S.stepLog[D.today] || (S.stepLog[D.today] = {}))[key] = {ts: Date.now(), g: 1}; }
  else { const m = S.stepLog[D.today]; if (m && m[key]){ delete m[key]; if (!Object.keys(m).length) delete S.stepLog[D.today]; } }
}
function toggle(id, el){
  const k = vday === 'today' ? D.today : D.yest;
  const before = D;
  const task = S.tasks.find(x => x.id === id);
  let completing = false;
  if (done(k,id)){
    const saved = JSON.stringify({log:S.log[k], pl:S.pickLog[k], sn:S.snap[k], pk:S.picks[k]});
    delete S.log[k][id]; if (!Object.keys(S.log[k]).length) delete S.log[k];
    if (S.pickLog[k]){ const p = S.pickLog[k][id]; if (p) (S.picks[k] || (S.picks[k] = {}))[id] = p; delete S.pickLog[k][id]; if (!Object.keys(S.pickLog[k]).length) delete S.pickLog[k]; }
    if (S.snap[k]){ delete S.snap[k][id]; if (!Object.keys(S.snap[k]).length) delete S.snap[k]; }
    const chk = derive();
    const lock = undoLock(chk, before);
    if (lock){
      const o = JSON.parse(saved);
      for (const [key, val] of [['log',o.log],['pickLog',o.pl],['snap',o.sn],['picks',o.pk]]){ if (val) S[key][k] = val; else delete S[key][k]; }
      toast(lock);
      return;
    }
  } else {
    if (!task || offOn(task, k) || !isDue(task, k) || waived(k, id)) return;   // closed, rested or retired today
    completing = true;
    const first = (S.firstTs[k] || {})[id];
    // a yesterday task on the day you checked in lands after check-in, so it can't skip past the Inn
    const innSt = (S.inn || []).find(st => st.from === k && st.ts);
    const ts = first || (vday === 'today' ? Date.now() : Math.max(parseKey(k).setHours(21,0,0,0), innSt ? innSt.ts + 1 : 0));
    (S.firstTs[k] || (S.firstTs[k] = {}))[id] = ts;
    for (const d of Object.keys(S.firstTs)) if (d < D.yest) delete S.firstTs[d];
    (S.log[k] || (S.log[k] = {}))[id] = ts;
    let stats = task ? task.stats : ['MGT'];
    if (task && task.pool && task.pool.length){ const p = pickFor(task, k); stats = p.stats; (S.pickLog[k] || (S.pickLog[k] = {}))[id] = {n:p.name, s:p.stats.slice()}; }
    if (task) (S.snap[k] || (S.snap[k] = {}))[id] = snapOf(task, stats, k);
  }
  save();
  const after = derive();
  const dx = after.xp - before.xp, dg = after.balance - before.balance, dd = after.cur.dmg - before.cur.dmg;
  const r = el.getBoundingClientRect();
  render();
  if (recoveryMode) return;
  if (completing) confetti(r);
  if (dx > 0){
    floatAt(r.left + r.width/2, r.top, `<span style="color:var(--accent)">+${dx} XP</span>  <span style="color:var(--gold)">+${dg} G</span>${dd>0 && before.cur.status==='now' ? `<br><span style="color:var(--hp)">-${dd} HP</span>` : ''}`);
    jumpUntil = Date.now() + 700; if (dd > 0) hurtUntil = Date.now() + 500;
  }
  if (after.lv.level > before.lv.level){ toast(stage(after.lv.level) > stage(before.lv.level) ? `Level ${after.lv.level}! ${S.petName} evolved.` : `Level ${after.lv.level}!`); }
  else if (after.cur.status === 'won' && before.cur.status === 'now'){ toast(`${after.cur.boss.name} defeated! +${BOSS_REWARD(after.cur.boss)} G and ${dropName(after.cur.boss)}`); }
  else { const t = S.tasks.find(x => x.id === id); if (t && t.cad === 'week' && dx > 0 && weekCount(id,k) === effTarget(t,k)) toast(`Weekly goal hit: ${t.name}. +30 G chest`); }
  const bm = document.getElementById('bossmini'); if (bm && dd > 0){ bm.classList.remove('shake'); void bm.offsetWidth; bm.classList.add('shake'); }
}

function cast(id, el){
  const sk = SKILL_BY[id], st = D.skills[id], k = D.today;
  if (!st || !st.ready || !st.l) return;
  if (!skillGearOk(sk)){ toast(`${sk.name} needs a ${STYLES[sk.branch].name} build`); return; }
  const use = {id, ts: Date.now(), date: k, cost: st.cost};
  let msg = '';
  if (sk.kind === 'dmg'){ if (D.cur.status !== 'now' || D.inn) return; use.dmg = st.power; msg = `${sk.name}: ${st.power} damage to ${D.cur.boss.name}`; }
  if (sk.kind === 'buff'){
    if (D.activeBuffs.some(u => u.id === id)){ toast(`${sk.name} is already active`); return; }
    use.buff = {st: {[sk.stat]: sk.amt(st.l)}, days: sk.days};
    msg = `${sk.name}: +${sk.amt(st.l)} ${STATS[sk.stat].name} for ${sk.days} days`;
  }
  // backstop: replay the day with this cast and refuse it if MP would run short anywhere
  S.skillLog.push(use); const chk = derive(); S.skillLog.pop();
  if (chk.castDeficit > D.castDeficit){ toast('Not enough MP'); return; }
  if (id === 'wind' || id === 'lighten'){
    const sel = document.getElementById('sel-' + id); const tid = sel && sel.value; if (!tid) return;
    const t = S.tasks.find(x => x.id === tid); if (!t) return;
    use.task = tid;
    if (id === 'wind'){ (S.waives[k] || (S.waives[k] = {}))[tid] = true; msg = `${t.name} is rested for today`; }
    else { const wk = weekKey(k); const m = S.lightens[wk] || (S.lightens[wk] = {}); m[tid] = (m[tid]||0) + 1; msg = `${t.name}: target is ${effTarget(t,k)} this week`; }
  }
  if (id === 'sanct'){ (S.waives[k] || (S.waives[k] = {}))['*'] = true; msg = 'Sanctuary: today is a rest day'; }
  const before = D;
  S.skillLog.push(use); save();
  const r = el.getBoundingClientRect();
  render();
  if (recoveryMode) return;
  if (use.dmg){ floatAt(r.left + r.width/2, r.top, `<span style="color:var(--hp)">-${use.dmg} HP</span>`); hurtUntil = Date.now() + 600; }
  else { floatAt(r.left + r.width/2, r.top, `<span style="color:var(--accent)">${esc(sk.name)}</span>`); jumpUntil = Date.now() + 700; }
  if (D.cur.status === 'won' && before.cur.status === 'now') toast(`${D.cur.boss.name} defeated! +${BOSS_REWARD(D.cur.boss)} G and ${dropName(D.cur.boss)}`);
  else toast(msg);
}

/* ---------- task editor sheet ---------- */
let draft = null;
function sheetSwitch(){ return `<div class="seg wide" role="group" aria-label="Panel"><button data-sheetmode="task" class="${sheetMode==='task'?'on':''}">Add task</button><button data-sheetmode="stats" class="${sheetMode==='stats'?'on':''}">Stats</button><button data-sheetmode="inv" class="${sheetMode==='inv'?'on':''}">Inventory</button></div>`; }
let statDraft = null;
function openPlus(mode){
  sheetMode = mode; statEdit = null; statDraft = null;
  if (mode === 'task') openEditor(null, false, true);
  else { draft = null; renderSheet(); showSheet(mode === 'inv' ? 'Inventory' : 'Stats'); }
}
function showSheet(label){
  document.getElementById('sheet').hidden = false;
  document.getElementById('sheetBody').setAttribute('aria-label', label);
  document.querySelectorAll('.app, .nav').forEach(n => n.inert = true);
}
function renderSheet(){
  if (sheetMode === 'stats'){
    const body = document.getElementById('sheetBody'), y = body.scrollTop;
    body.innerHTML = `<div class="row between"><span class="d">Your stats</span><button class="btn ghost" data-close>Close</button></div>${sheetSwitch()}${renderStatsPanel()}`; body.scrollTop = y;
  } else if (sheetMode === 'inv'){
    const body = document.getElementById('sheetBody'), y = body.scrollTop;
    body.innerHTML = `<div class="row between"><span class="d">Inventory</span><span class="row" style="gap:8px"><span class="goldpill sm">${D.balance} G</span><button class="btn ghost" data-close>Close</button></span></div>${sheetSwitch()}${renderInventory()}`;
    drawIcons(body); body.scrollTop = y;
  } else renderEditor();
}
function openEditor(t, roulette, fromPlus){
  if (!fromPlus) sheetMode = null;
  draft = t ? clone(t) : {id:'t'+Date.now().toString(36), name:'', stats:['MGT'], cad:'day', target:3, created:D.today, isNew:true};
  if (!t && roulette) draft.pool = [{name:'', stats:['MGT']}, {name:'', stats:['MOB']}];
  if (!draft.days || !draft.days.length) draft.days = [0,1,2,3,4,5,6];
  renderEditor(); showSheet(draft.isNew ? (draft.pool ? 'New roulette' : 'New task') : 'Edit task');
  setTimeout(() => { const n = document.getElementById('tName'); if (n) n.focus(); }, 30);
}

async function goUpdate(v, manual){

  if (!manual && t.v === v && (t.n >= 3 || Date.now() - t.at < 60000)) return;

  for (let i = 0; i < 20 && cloud.writing; i++) await new Promise(res => setTimeout(res, 250));

}

      const it = {id:'i' + Date.now().toString(36) + Math.floor(Math.random()*1e4), text, createdOn: D.today}; const pri = f.dataset.pri; if (pri === 'high' || pri === 'med' || pri === 'low') it.pri = pri;

      const g = priOf(it); let at = -1; L.items.forEach((x, i) => { if (priOf(x) === g) at = i; });
      if (at < 0){ const order = PRI.map(p => p[0]); at = -1; L.items.forEach((x, i) => { if (order.indexOf(priOf(x)) < order.indexOf(g)) at = i; }); }
      L.items.splice(at + 1, 0, it); save(); render(); const n = document.getElementById('add-' + L.id); if (n) n.focus(); return; }
  } catch(err){ console.error(err); enterRecovery(String(err && err.message || err)); showRecovery(); }
});

/* ---------- drag to reorder to-dos (also moves them between priority groups) ---------- */
let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]'); if (!h || recoveryMode || drag) return;
  const row = h.closest('.tditem'); if (!row) return;
  e.preventDefault();
  const r = row.getBoundingClientRect();
  const ph = document.createElement('div'); ph.className = 'tdph'; ph.style.height = r.height + 'px';
  row.parentNode.insertBefore(ph, row);
  row.classList.add('dragging'); row.style.width = r.width + 'px'; row.style.left = r.left + 'px'; row.style.top = r.top + 'px';
  document.body.appendChild(row);
  drag = {id: h.dataset.drag, row, ph, dy: e.clientY - r.top, pid: e.pointerId, y: e.clientY};
  try { h.setPointerCapture(e.pointerId); } catch(err){}
  document.body.classList.add('dragmode');
}, {passive:false});
function dragMove(y){
  const d = drag; d.y = y; d.row.style.top = (y - d.dy) + 'px';
  const lists = [...document.querySelectorAll('.tdlist')]; if (!lists.length) return;
  // which group: the last group whose top is above the pointer
  let tgt = lists[0];
  for (const l of lists){ const head = l.closest('.tdgroup'); if (head.getBoundingClientRect().top <= y) tgt = l; }
  const rows = [...tgt.querySelectorAll('.tditem')];
  const before = rows.find(x => { const b = x.getBoundingClientRect(); return y < b.top + b.height/2; });
  if (before) tgt.insertBefore(d.ph, before); else tgt.appendChild(d.ph);
}
document.addEventListener('pointermove', e => { if (!drag || e.pointerId !== drag.pid) return; e.preventDefault(); dragMove(e.clientY); }, {passive:false});
setInterval(() => { if (!drag) return; const m = 70; if (drag.y < m) { window.scrollBy(0, -12); dragMove(drag.y); } else if (drag.y > innerHeight - m - 90){ window.scrollBy(0, 12); dragMove(drag.y); } }, 30);
function dragEnd(cancel){
  const d = drag; if (!d) return; drag = null; document.body.classList.remove('dragmode');
  const g = d.ph.parentNode && d.ph.parentNode.dataset.group;
  const sib = d.ph.parentNode ? [...d.ph.parentNode.children] : [];
  const nextEl = sib.slice(sib.indexOf(d.ph) + 1).find(x => x.classList && x.classList.contains('tditem'));
  d.row.remove(); d.ph.remove();
  const L = curTodoList(); const it = L && L.items.find(x => x.id === d.id);
  if (cancel || !L || !it || !g){ render(); return; }
  L.items = L.items.filter(x => x !== it);
  if (g === 'none') delete it.pri; else it.pri = g;
  let at;
  if (nextEl){ at = L.items.findIndex(x => x.id === nextEl.dataset.item); }
  if (at == null || at < 0){
    // end of the group: after its last item, or after the groups above it
    const order = PRI.map(p => p[0]); at = 0;
    L.items.forEach((x, i) => { if (order.indexOf(priOf(x)) <= order.indexOf(g)) at = i + 1; });
  }
  L.items.splice(at, 0, it); save(); render();
}
document.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.pid) dragEnd(false); });
document.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.pid) dragEnd(true); });

/* ---------- drag to reorder checklist steps (task editor and to-do edit mode) ---------- */
let sdrag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-sdrag]'); if (!h || recoveryMode || sdrag || drag) return;
  const row = h.closest('[data-sid]'), list = h.closest('[data-sdlist]'); if (!row || !list) return;
  e.preventDefault(); try { h.setPointerCapture(e.pointerId); } catch(err){}
  row.classList.add('sdragging'); document.body.classList.add('dragmode');
  sdrag = {row, list, pid: e.pointerId};
}, {passive:false});
document.addEventListener('pointermove', e => {
  if (!sdrag || e.pointerId !== sdrag.pid) return; e.preventDefault();
  const {row, list} = sdrag, y = e.clientY;
  const rows = [...list.querySelectorAll(':scope > [data-sid]')].filter(x => x !== row);
  const before = rows.find(x => { const b = x.getBoundingClientRect(); return y < b.top + b.height / 2; });
  if (before){ if (row.nextElementSibling !== before) list.insertBefore(row, before); }
  else if (rows.length && rows[rows.length - 1].nextElementSibling !== row) rows[rows.length - 1].after(row);
}, {passive:false});
function sdragEnd(){
  const d = sdrag; if (!d) return; sdrag = null; document.body.classList.remove('dragmode'); d.row.classList.remove('sdragging');
  const order = [...d.list.querySelectorAll(':scope > [data-sid]')].map(x => x.dataset.sid), kind = d.list.dataset.sdlist;
  const sortBy = arr => arr.slice().sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  if (kind === 'editor' && draft && draft.checklist){ readEditorFields(); const byId = Object.fromEntries(draft.checklist.map(c => [c.id, c]));
    // inputs moved with their rows, so read each one's text by its row before re-rendering
    d.list.querySelectorAll(':scope > [data-sid]').forEach(r => { const inp = r.querySelector('input'); if (inp && byId[r.dataset.sid]) byId[r.dataset.sid].text = inp.value; });
    draft.checklist = sortBy(draft.checklist); renderEditor(); return; }
  if (kind.startsWith('td|')){ const [, lid, iid] = kind.split('|'); const L = S.todos.lists.find(x => x.id === lid); const it = L && L.items.find(x => x.id === iid);
    if (it && it.steps && !it.doneOn && todoEdit){ const next = sortBy(it.steps); if (next.some((x, i) => x !== it.steps[i])){ it.steps = next; save(); } } render(); }
}
document.addEventListener('pointerup', e => { if (sdrag && e.pointerId === sdrag.pid) sdragEnd(); });
document.addEventListener('pointercancel', e => { if (sdrag && e.pointerId === sdrag.pid) sdragEnd(); });

/* ---------- focus timer clock: finishes sessions even if you were on another tab or away ---------- */
function pomoTick(){
  let changed = false, guard = 0;
  while (guard++ < 10){
    const r = S.pomo && S.pomo.run; if (!r || r.idle || r.pauseAt) break;
    const dur = pomoMins(r.phase, r) * 60000 + (r.extra || 0), end = r.startTs + r.pausedMs + dur;
    if (Date.now() < end) break;
    if (r.phase === 'focus'){
      S.pomoLog.push({ts: end, mins: r.mins || S.pomo.cfg.focus});
      const n = r.n + 1;
      S.pomo.run = {phase: n % S.pomo.cfg.every === 0 ? 'long' : 'short', startTs: end, pausedMs: 0, pauseAt: null, n};
      toast('Focus session done! Break time.'); sfx('focusDone'); buzz([200, 100, 200, 100, 400]);
    } else {
      // breaks end in a ready state: the next focus block never starts on its own
      S.pomo.run = {phase:'focus', startTs:0, pausedMs:0, pauseAt:null, n: r.phase === 'long' ? 0 : r.n, idle:true};
      toast('Break over. Ready when you are.'); sfx('breakDone'); buzz([150, 80, 150]);
    }
    changed = true;
  }
  if (changed && !recoveryMode){ save(); render(); }
  else if (tab === 'focus') updateFocusClock();
}
setInterval(() => { if (!recoveryMode && D) pomoTick(); }, 1000);

/* ---------- focus timer sounds (made on the fly, no files) and vibration ---------- */
let actx = null;
function sfxInit(){ try { if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } if (actx && actx.state === 'suspended') actx.resume(); } catch(e){} }
function tone(freq, t0, dur, vol){
  const o = actx.createOscillator(), g = actx.createGain(), o2 = actx.createOscillator(), g2 = actx.createGain();
  o.type = 'sine'; o.frequency.value = freq; o2.type = 'triangle'; o2.frequency.value = freq * 2; g2.gain.value = 0.15;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(actx.destination); o.start(t0); o2.start(t0); o.stop(t0 + dur + 0.05); o2.stop(t0 + dur + 0.05);
}
const SFX = {
  start:     [[523.25, 0, .22], [783.99, .11, .45]],
  pause:     [[587.33, 0, .14], [440, .08, .2]],
  resume:    [[440, 0, .12], [587.33, .08, .22]],
  stop:      [[392, 0, .25]],
  tick:      [[1046.5, 0, .06]],
  focusDone: [[659.25, 0, .4], [783.99, .16, .4], [1046.5, .32, .5], [1318.5, .5, .9]],
  breakDone: [[783.99, 0, .35], [659.25, .18, .35], [523.25, .36, .7]]
};
function sfx(name){
  try { if (!S.pomo.cfg.sound || !SFX[name]) return; sfxInit(); if (!actx) return;
    const t = actx.currentTime + 0.02, vol = name === 'focusDone' || name === 'breakDone' ? 0.22 : 0.14;
    for (const [f, dt, d] of SFX[name]) tone(f, t + dt, d, vol); } catch(e){}
}
function buzz(pattern){ try { if (S.pomo.cfg.haptic && navigator.vibrate) navigator.vibrate(pattern); } catch(e){} }

/* ---------- lo-fi music while a focus session runs: made live with Web Audio (no files, no streaming) ----------
   72 bpm, swung: soft electric-piano 7th chords, a round bass, a dusty kick/snare/hat beat, a few lazy melody
   notes and a little vinyl crackle, all through a warm low-pass. It fades in when focus starts and out on
   pause, breaks or stop. */
const LOFI_BPM = 72, LOFI_PROGS = [
  [[50,53,57,60,64],[43,53,55,59,62],[48,52,55,59,62],[45,48,52,55,59]],   // Dm9  G13  Cmaj9  Am9
  [[41,52,55,57,60],[40,50,55,59,62],[38,53,57,60,64],[43,53,57,59,64]],   // Fmaj7 Em7 Dm9 G7
  [[45,55,60,64,67],[50,57,60,64,65],[43,53,57,59,62],[48,55,59,62,64]]    // Am7 Dm7 G9 Cmaj7
];
let lofi = null;
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
function lofiWanted(){ const r = S.pomo && S.pomo.run; return !!(S.pomo && S.pomo.cfg.music && r && !r.idle && !r.pauseAt && r.phase === 'focus' && !recoveryMode); }
function musicSync(){
  try {
    const want = lofiWanted();
    if (want && !lofi) lofiStart();
    else if (!want && lofi) lofiStop();
  } catch(e){}
}
// a timer restored after a reload can't start sound until you touch the page; the first tap wakes it
document.addEventListener('pointerdown', () => { try { if (lofi && actx && actx.state === 'suspended') actx.resume(); } catch(e){} }, {passive: true});
function lofiStart(){
  sfxInit(); if (!actx) return;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}   // play even with the iPhone's silent switch on
  const now = actx.currentTime;
  const master = actx.createGain(); master.gain.setValueAtTime(0.0001, now); master.gain.exponentialRampToValueAtTime(0.85, now + 2.5);
  const warm = actx.createBiquadFilter(); warm.type = 'lowpass'; warm.frequency.value = 2400; warm.Q.value = 0.4;
  master.connect(warm); warm.connect(actx.destination);
  // one second of white noise, reused for drums and crackle
  const nb = actx.createBuffer(1, actx.sampleRate, actx.sampleRate), nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  // vinyl: a quiet hiss plus sparse pops, looping
  const vb = actx.createBuffer(1, actx.sampleRate * 3, actx.sampleRate), vd = vb.getChannelData(0);
  for (let i = 0; i < vd.length; i++) vd[i] = (Math.random() * 2 - 1) * 0.012 + (Math.random() < 0.00035 ? (Math.random() * 2 - 1) * 0.5 : 0);
  const vin = actx.createBufferSource(); vin.buffer = vb; vin.loop = true; const vf = actx.createBiquadFilter(); vf.type = 'bandpass'; vf.frequency.value = 3000; vf.Q.value = 0.6;
  const vg = actx.createGain(); vg.gain.value = 0.5; vin.connect(vf); vf.connect(vg); vg.connect(master); vin.start(now);
  lofi = {master, noise: nb, vin, next: now + 0.15, step: 0, bar: 0, prog: LOFI_PROGS[Math.floor(Math.random() * LOFI_PROGS.length)], timer: 0};
  lofi.timer = setInterval(lofiSchedule, 200); lofiSchedule();
}
function lofiStop(){
  const L = lofi; lofi = null; if (!L) return;
  clearInterval(L.timer);
  try { const t = actx.currentTime; L.master.gain.cancelScheduledValues(t); L.master.gain.setValueAtTime(Math.max(0.0001, L.master.gain.value), t); L.master.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
    setTimeout(() => { try { L.vin.stop(); L.master.disconnect(); } catch(e){} }, 1400); } catch(e){}
}
// schedules ~1.5s ahead so a backgrounded tab (timers slowed to once a second) doesn't leave gaps
function lofiSchedule(){
  const L = lofi; if (!L || !actx) return;
  const eighth = 60 / LOFI_BPM / 2;
  while (L.next < actx.currentTime + 1.5){
    const st = L.step % 8, t = L.next + (st % 2 ? eighth * 0.18 : 0);   // swing the off-beats
    if (st === 0){ if (L.bar % 4 === 0 && L.bar && Math.random() < 0.35) L.prog = LOFI_PROGS[Math.floor(Math.random() * LOFI_PROGS.length)]; lofiChord(L, L.prog[L.bar % 4], t, eighth * 8); }
    const root = L.prog[L.bar % 4][0];
    if (st === 0 || st === 5) lofiBass(L, root - 12, t, eighth * (st === 0 ? 3.5 : 2.5));
    if (st === 0 || st === 3 || (st === 6 && Math.random() < 0.4)) lofiKick(L, t);
    if (st === 2 || st === 6) lofiSnare(L, t);
    if (Math.random() < 0.85) lofiHat(L, t, st % 2 ? 0.05 : 0.08);
    if (st % 2 === 0 && Math.random() < 0.22){ const ch = L.prog[L.bar % 4]; lofiKey(L, ch[1 + Math.floor(Math.random() * (ch.length - 1))] + 12, t, eighth * (1.5 + Math.random() * 2), 0.05); }
    L.next += eighth; L.step++; if (L.step % 8 === 0) L.bar++;
  }
}
function lofiKey(L, m, t, dur, vol){
  // electric-piano-ish: a sine with a quieter detuned triangle, soft attack and a long fade
  const f = midiHz(m), g = actx.createGain(), o = actx.createOscillator(), o2 = actx.createOscillator(), g2 = actx.createGain();
  o.type = 'sine'; o.frequency.value = f; o2.type = 'triangle'; o2.frequency.value = f; o2.detune.value = 7; g2.gain.value = 0.35;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.04); g.gain.exponentialRampToValueAtTime(vol * 0.45, t + 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.4);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(L.master); o.start(t); o2.start(t); o.stop(t + dur + 0.5); o2.stop(t + dur + 0.5);
}
function lofiChord(L, notes, t, dur){ notes.slice(1).forEach((m, i) => lofiKey(L, m, t + i * 0.012, dur, 0.045)); }
function lofiBass(L, m, t, dur){
  const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = midiHz(m);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(L.master); o.start(t); o.stop(t + dur + 0.05);
}
function lofiKick(L, t){
  const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine';
  o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.18);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  o.connect(g); g.connect(L.master); o.start(t); o.stop(t + 0.4);
}
function lofiNoise(L, t, dur, type, freq, vol){
  const n = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(); n.buffer = L.noise;
  f.type = type; f.frequency.value = freq; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  n.connect(f); f.connect(g); g.connect(L.master); n.start(t, Math.random() * 0.5); n.stop(t + dur + 0.02);
}
function lofiSnare(L, t){ lofiNoise(L, t, 0.22, 'bandpass', 1700, 0.12); }
function lofiHat(L, t, vol){ lofiNoise(L, t, 0.045, 'highpass', 7000, vol * 0.6); }
</script>
